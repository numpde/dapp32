# Temporary maintainer diagnostic. Remove before merging.
name: CI source diagnostic archive
on:
  push:
    branches: [fix/ci-infrastructure-and-regressions-20261110]
    paths: [.github/workflows/ci-source-debug.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reproduce documentation lifecycle under the exact offline check image
        run: |
          sed -i 's/\["bash", "-eu", "-o"/["bash", "-xeu", "-o"/' tests/checks/test_docs_build_lifecycle.py
          docker compose -f compose/checks.yml run --build --rm -T checks -I -B -m unittest discover -s tests/checks -t . -p test_docs_build_lifecycle.py -k test_success_publishes_and_cleans_the_private_stage_and_tmpfs_volume -v
      - run: git archive --format=tar HEAD | gzip -n > source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-source-diagnostic
          path: source.tar.gz
          if-no-files-found: error
          retention-days: 1
