name: Source publication checks

on:
  push:
    paths:
      - .github/workflows/source-publication-checks.yml
      - tools/release_source.py
      - tools/release_instance.py
      - tools/release_config.py
      - tests/checks/test_release_source.py
  pull_request:
    paths:
      - .github/workflows/source-publication-checks.yml
      - tools/release_source.py
      - tools/release_instance.py
      - tools/release_config.py
      - tests/checks/test_release_source.py

permissions:
  contents: read

concurrency:
  group: source-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run focused source publication tests
        run: python3 -m unittest -v tests.checks.test_release_source
