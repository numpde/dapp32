name: Source publication checks

on:
  push:
    paths:
      - .github/workflows/source-publication-checks.yml
      - js/tools/release-compiled-contract.ts
      - js/tools/source-publication-prepare.ts
      - js/tools/release-approval/source-publication.test.ts
      - Makefile
      - tools/release_instance.sh
      - tools/release_source.sh
      - tests/checks/test_release_source_launcher.py
      - tests/checks/test_release_instance_launcher.py
      - tools/release_identity.py
      - tools/release_identity.sh
      - tests/checks/test_release_identity.py
      - tools/release_approval_image_build.sh
      - tools/release_approval_deploy.sh
      - tools/release_full.sh
      - tests/checks/test_release_lifecycle.py
      - tools/release_cam.sh
      - tools/release_source_files.sh
      - tests/checks/test_release_cam.py
      - compose/release/cam-source.yml
      - tests/checks/test_release_approval_diagnostics.py
      - containers/release-approval/prepare-context.test.mjs
      - containers/release-approval/prepare-context.mjs
      - containers/release-approval/approval-inputs.mjs
      - tests/checks/test_release_approval_image.py
      - compose/release/approval-image.yml
      - compose/package-deps.yml
      - tools/release_source.py
      - tools/release_instance.py
      - tools/release_config.py
      - tests/checks/test_release_source.py
  pull_request:
    paths:
      - .github/workflows/source-publication-checks.yml
      - js/tools/release-compiled-contract.ts
      - js/tools/source-publication-prepare.ts
      - js/tools/release-approval/source-publication.test.ts
      - Makefile
      - tools/release_instance.sh
      - tools/release_source.sh
      - tests/checks/test_release_source_launcher.py
      - tools/release_identity.py
      - tools/release_identity.sh
      - tests/checks/test_release_identity.py
      - tools/release_approval_image_build.sh
      - tools/release_approval_deploy.sh
      - tools/release_full.sh
      - tests/checks/test_release_lifecycle.py
      - tools/release_cam.sh
      - tools/release_source_files.sh
      - tests/checks/test_release_cam.py
      - compose/release/cam-source.yml
      - tests/checks/test_release_approval_diagnostics.py
      - containers/release-approval/prepare-context.test.mjs
      - containers/release-approval/prepare-context.mjs
      - containers/release-approval/approval-inputs.mjs
      - tests/checks/test_release_approval_image.py
      - compose/release/approval-image.yml
      - compose/package-deps.yml
      - tools/release_source.py
      - tools/release_instance.py
      - tools/release_config.py
      - tests/checks/test_release_source.py

permissions:
  contents: read

concurrency:
  group: source-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run focused source publication tests
        run: python3 -m unittest -v tests.checks.test_release_source tests.checks.test_release_identity tests.checks.test_release_approval_image tests.checks.test_release_approval_diagnostics tests.checks.test_release_cam tests.checks.test_release_source_launcher tests.checks.test_release_instance_launcher tests.checks.test_release_lifecycle.ReleaseFullCompositionTests tests.checks.test_release_lifecycle.ReleaseLifecycleTest.test_failed_cam_keyless_completion_preserves_evidence_without_self_retry_advice
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js
      - name: Check release TypeScript and original-metadata tests
        working-directory: js
        run: |
          npm run build:packages
          ./node_modules/.bin/tsc -p tools/release-approval/tsconfig.json
          node --test --experimental-strip-types tools/release-approval/source-publication.test.ts
      - name: Qualify approval image host builder under non-root runner
        run: node --experimental-strip-types --test containers/release-approval/prepare-context.test.mjs
