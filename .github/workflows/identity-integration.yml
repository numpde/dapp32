name: Identity integration

on:
  push:
    branches-ignore: [deploy/viewer]
    tags: ['**']
    paths:
      - .github/workflows/identity-integration.yml
      - Makefile
      - tests/checks/test_repository_hygiene.py
      - tools/docker_context.sh
      - tools/release_identity.py
      - tools/release_identity.sh
      - tools/release_identity_check.sh
      - tools/release_process.sh
      - tools/compose_cleanup.sh
      - tests/live/check_release_identity.py
      - tests/live/release_identity.yml
      - tests/checks/test_release_identity_lane.py
      - tests/checks/test_docker_context.py
  pull_request:
    paths:
      - .github/workflows/identity-integration.yml
      - Makefile
      - tests/checks/test_repository_hygiene.py
      - tools/docker_context.sh
      - tools/release_identity.py
      - tools/release_identity.sh
      - tools/release_identity_check.sh
      - tools/release_process.sh
      - tools/compose_cleanup.sh
      - tests/live/check_release_identity.py
      - tests/live/release_identity.yml
      - tests/checks/test_release_identity_lane.py
      - tests/checks/test_docker_context.py

permissions:
  contents: read

jobs:
  rootful:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retain the exact integration source
        run: |
          mkdir -p "$RUNNER_TEMP/identity-audit"
          git bundle create "$RUNNER_TEMP/identity-audit/source.bundle" HEAD
      - name: Verify lane failures, cancellation and cleanup
        run: >-
          python3 -B -m unittest -v
          tests.checks.test_release_identity_lane
          tests.checks.test_release_identity
          tests.checks.test_docker_context
          tests.checks.test_repository_hygiene.RepositoryHygieneTest.test_live_checks_are_make_owned_and_exposed_in_the_aggregate
          tests.checks.test_repository_hygiene.RepositoryHygieneTest.test_ci_uses_make_not_private_tool_scripts_for_host_checks
          tests.checks.test_repository_hygiene.RepositoryHygieneTest.test_make_help_mentions_existing_targets
          tests.checks.test_repository_hygiene.RepositoryHygieneTest.test_make_phony_targets_are_real_targets
          tests.checks.test_repository_hygiene.RepositoryHygieneTest.test_make_targets_are_unique
      - name: Qualify the selected engine through the maintained lane
        run: make tests/live/release-identity DOCKER_CONTEXT=default
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: identity-audit
          path: ${{ runner.temp }}/identity-audit
          retention-days: 1
