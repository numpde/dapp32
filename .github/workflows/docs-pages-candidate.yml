name: Docs Pages candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs-pages-candidate.yml
      - docs/**
      - compose/docs.yml
      - compose/fragments/node-workspace.yml
      - containers/node-deps/**
      - js/package.json
      - js/package-lock.json
      - Makefile
      - tests/checks/test_docs_port.py
      - tests/checks/test_docs_build_lifecycle.py
      - tests/checks/test_docs_site.py
      - tools/make/docs.mk
      - tools/docs_site.py
      - .github/workflows/docs-publish.yml
  pull_request:
    paths:
      - .github/workflows/docs-pages-candidate.yml
      - docs/**
      - compose/docs.yml
      - js/package.json
      - js/package-lock.json
      - Makefile
      - tools/make/docs.mk
      - tools/docs_site.py
      - tests/checks/test_docs_port.py
      - tests/checks/test_docs_build_lifecycle.py
      - tests/checks/test_docs_site.py
      - .github/workflows/docs-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-candidate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Pull reviewed Node build base
        shell: bash
        run: |
          set -euo pipefail
          base="$(awk '$1 == "FROM" { print $2 }' source/containers/node-deps/Dockerfile)"
          test -n "$base"
          CAM_DOCKER_ENDPOINT="$(bash source/tools/docker_context.sh "command line" default undefined "" 0)"
          docker --host "$CAM_DOCKER_ENDPOINT" pull "$base"

      - name: Install existing checksum-locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          make -C source js/deps/install DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=docs-pages-candidate
          test -e source/js/node_modules/vitepress/package.json

      - name: Qualify migrated pages and disposable build lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 -B -m unittest -v tests.checks.test_docs_port tests.checks.test_docs_build_lifecycle

      - name: Build docs with confined Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs-output
          make -C source docs/build DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=docs-pages-candidate \
            DOCS_OUTPUT_DIR="$GITHUB_WORKSPACE/docs-output"

      - name: Verify complete generated-site routes and immutable resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -B source/tools/docs_site.py check source/docs docs-output/site

      - name: Retain exact qualified site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-pages-candidate
          path: docs-output/site/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

