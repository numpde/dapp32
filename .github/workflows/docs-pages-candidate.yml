name: Documentation qualification and automatic publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/docs-pages-candidate.yml
      - docs/**
      - compose/docs.yml
      - compose/fragments/node-workspace.yml
      - containers/node-deps/**
      - js/package.json
      - js/package-lock.json
      - Makefile
      - tools/make/docs.mk
      - tools/docs_site.py
      - 'tests/checks/test_docs_*.py'
  pull_request:
    paths:
      - .github/workflows/docs-pages-candidate.yml
      - docs/**
      - compose/docs.yml
      - js/package.json
      - js/package-lock.json
      - Makefile
      - tools/make/docs.mk
      - tools/docs_site.py
      - 'tests/checks/test_docs_*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-candidate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Pull reviewed Node build base
        shell: bash
        run: |
          set -euo pipefail
          base="$(awk '$1 == "FROM" { print $2 }' source/containers/node-deps/Dockerfile)"
          test -n "$base"
          CAM_DOCKER_ENDPOINT="$(bash source/tools/docker_context.sh "command line" default undefined "" 0)"
          docker --host "$CAM_DOCKER_ENDPOINT" pull "$base"

      - name: Install existing checksum-locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          make -C source js/deps/install DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=docs-pages-candidate
          test -e source/js/node_modules/vitepress/package.json

      - name: Qualify migrated pages and disposable build lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 -B -m unittest discover -v -s tests/checks -t . -p 'test_docs_*.py'

      - name: Build docs with confined Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs-output
          make -C source docs/build DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=docs-pages-candidate \
            DOCS_OUTPUT_DIR="$GITHUB_WORKSPACE/docs-output"

      - name: Verify complete generated-site routes and immutable resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -B source/tools/docs_site.py check source/docs docs-output/site

      - name: Retain exact qualified site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-pages-candidate
          path: docs-output/site/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The independently qualified viewer publisher also updates gh-pages.
    concurrency:
      group: gh-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out qualified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Check out independent Pages publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: site
          persist-credentials: true

      - name: Download the exact qualified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-pages-candidate
          path: qualified

      - name: Verify the configured Pages source before modifying gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages-settings.json"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          settings = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pages-settings.json").read_text())
          origin = settings.get("source") or {}
          if (settings.get("build_type") != "legacy" or origin.get("branch") != "gh-pages"
                  or origin.get("path") != "/"):
              raise SystemExit("Pages must publish gh-pages / in branch mode")
          PY

      - name: Validate, stage and update gh-pages without touching the viewer
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

          # Never publish a superseded source revision.
          current="$(git -C site ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer source revision exists; refuse stale documentation publication." >&2
            exit 2
          fi
          python3 -B source/tools/docs_site.py check source/docs qualified
          python3 -B source/tools/docs_site.py stage source/docs qualified site "$GITHUB_SHA" "$GITHUB_RUN_ID"
          cd site
          git add -A -- .
          if git diff --cached --name-only -- viewer/ | grep -v '^viewer/deploy\.html$' | grep -q .; then
            echo "Documentation publisher must not modify viewer application files." >&2
            exit 2
          fi
          if git diff --cached --quiet; then
            echo 'Published branch already matches the qualified documentation.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish qualified docs from $GITHUB_SHA (run $GITHUB_RUN_ID)"
          # Check again immediately before the update. git push is non-forced,
          # and therefore refuses concurrent gh-pages publication.
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "::error::Source main changed during staging; refuse stale publication." >&2
            exit 2
          fi
          git push origin HEAD:refs/heads/gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN git push does not by itself trigger a Pages branch build.
      - name: Request and verify Pages deployment from gh-pages
        if: steps.publication.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publication.outputs.published_sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > "$RUNNER_TEMP/pages-request.json"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          request = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pages-request.json").read_text())
          if request.get("status") != "queued":
              raise SystemExit(f"Unexpected Pages build request: {request!r}")
          PY

          for attempt in {1..48}; do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > "$RUNNER_TEMP/pages-result.json"
            if python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          build = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pages-result.json").read_text())
          if build.get("commit") != os.environ["PUBLISHED_SHA"]:
              raise SystemExit(1)
          if build.get("status") == "built":
              print("GitHub Pages confirmed this exact published commit.")
              raise SystemExit(0)
          if build.get("status") in ("errored", "failed", "canceled"):
              raise SystemExit(f"GitHub Pages build failed: {build.get('error')}")
          raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages did not confirm the published commit $PUBLISHED_SHA." >&2
          exit 2
