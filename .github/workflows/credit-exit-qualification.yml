name: Credit exit test qualification

on:
  push:
    branches: [test/pay-to-play-credit-exit-qualification]
    paths: [.github/workflows/credit-exit-qualification.yml]

permissions:
  contents: write

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 02a49915e34fe4a7e1ef345fb7f892ffa9bc3a9b
          fetch-depth: 0
          persist-credentials: false
      - name: Correct the test import without changing policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 02a49915e34fe4a7e1ef345fb7f892ffa9bc3a9b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          path = Path('dapps/pay-to-play/test/unit/PayToPlayWithdrawalFunding.t.sol')
          old = path.read_bytes()
          assert blob(old) == 'dfd656f4d6f6557faa10d880b6378331d5761c86'
          before = b'import {Vm} from "forge-std-1.12.0/src/Vm.sol";'
          after = b'import {Vm} from "forge-std-1.12.0/src/Test.sol";'
          assert old.count(before) == 1
          new = old.replace(before, after)
          assert blob(new) == '2578aaf1b82742c40baffb87d9926b64c91c8cff'
          path.write_bytes(new)
          PY
          git diff --check
          git add dapps/pay-to-play/test/unit/PayToPlayWithdrawalFunding.t.sol
          git commit -m 'Import the Forge log type through the allowed test entrypoint' -m 'Problem: The unit/scenario lane stopped in repository checks because the new log assertions imported Vm.sol directly; the import policy permits Test.sol as the forge-std test entrypoint.' -m 'Rationale: Existing Bike tests import Test and Vm through Test.sol. Use that public test entrypoint without adding a policy exemption or changing behavior.' -m 'Solution: Change only the new funding test import path from Vm.sol to Test.sol. All assertions and production source remain unchanged.' -m 'Validation: The preceding run compiled the Solidity tests and reproduced both deterministic early-exit invariant witnesses; the actual CAM scenario failed at the expected missing restart. The repository check correctly exposed this import violation. Exact replacement blob checked; full supported lanes rerun on this commit.'
      - name: Verify scope and publish only the requested test branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              'dapps/pay-to-play/test/unit/PayToPlayWithdrawalFunding.t.sol',
              'dapps/pay-to-play/test/unit/PayToPlay.t.sol',
              'dapps/pay-to-play/test/unit/PayToPlayRecovery.t.sol',
              'dapps/pay-to-play/test/invariant/PayToPlayRecovery.invariant.t.sol',
              'js/tools/pay-to-play-local-scenario/runner.ts',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','82ccbb108b5d4e67537d0cb92c85a84eb6151de8'], text=True).splitlines())
          assert changed == allowed, changed
          PY
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/test/pay-to-play-credit-exit-window
          mkdir -p "$RUNNER_TEMP/credit-exit-results"
          git rev-parse HEAD | tee "$RUNNER_TEMP/credit-exit-results/test-head.txt"
          git diff --stat 82ccbb108b5d4e67537d0cb92c85a84eb6151de8
          git archive HEAD dapps/pay-to-play/test js/tools/pay-to-play-local-scenario/runner.ts > "$RUNNER_TEMP/credit-exit-results/tests.tar"
      - name: Install locked test dependencies
        id: deps
        run: |
          make dapps/deps/install DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=credit-exit-qualification
          make js/deps/install DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=credit-exit-qualification
      - name: Check the pinned formatter leaves the test checkout unchanged
        id: format
        run: |
          make pay-to-play/format DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=credit-exit-qualification
          git diff --exit-code
      - name: Run existing unit and scenario lane (restart assertions should be red)
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: |
          set -o pipefail
          make dapps/tests/unit-scenario DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=credit-exit-qualification 2>&1 | tee "$RUNNER_TEMP/credit-exit-results/unit.log"
      - name: Run existing invariant lane (deterministic witnesses should be red)
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: |
          set -o pipefail
          make dapps/tests/invariant DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=credit-exit-qualification 2>&1 | tee "$RUNNER_TEMP/credit-exit-results/invariant.log"
      - name: Run actual CAM scenario (unchanged contract should reject the expectation)
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: |
          set -o pipefail
          make pay-to-play/local/scenario/run DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=credit-exit-qualification 2>&1 | tee "$RUNNER_TEMP/credit-exit-results/scenario.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: credit-exit-test-results
          path: ${{ runner.temp }}/credit-exit-results
          retention-days: 1
          if-no-files-found: warn
