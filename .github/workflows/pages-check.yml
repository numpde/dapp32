name: Published documentation checks

on:
  push:
    paths:
      - '**/*.html'
      - check_pages.py
      - check_reference.py
      - theme.js
      - site.css
      - Makefile
      - .github/workflows/pages-check.yml
  pull_request:
    branches: [gh-pages]
    paths:
      - '**/*.html'
      - check_pages.py
      - check_reference.py
      - theme.js
      - site.css
      - Makefile
      - .github/workflows/pages-check.yml

permissions:
  contents: read

concurrency:
  group: pages-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the documentation candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: site
          persist-credentials: false
      - name: Check out the source used by documentation examples
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: source
          persist-credentials: false
      - name: Run the maintained offline documentation check
        env:
          DOCKER_CONTEXT: default
        run: make -C site pages/check SOURCE_REPO="$GITHUB_WORKSPACE/source"
      - name: Retain committed inputs for independent review
        run: |
          mkdir -p "$RUNNER_TEMP/documentation-review"
          git -C site archive --format=tar.gz --output="$RUNNER_TEMP/documentation-review/site.tar.gz" HEAD
          git -C source archive --format=tar.gz --output="$RUNNER_TEMP/documentation-review/source.tar.gz" HEAD
          printf 'site %s\nsource %s\n' "$(git -C site rev-parse HEAD)" "$(git -C source rev-parse HEAD)" > "$RUNNER_TEMP/documentation-review/revisions.txt"
      - name: Upload documentation review inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-review
          path: ${{ runner.temp }}/documentation-review
          retention-days: 1
          if-no-files-found: error
