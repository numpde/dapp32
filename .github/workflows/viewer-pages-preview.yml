name: Viewer qualification and automatic Pages publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/viewer-pages-preview.yml
      - tools/viewer_pages.py
      - tests/checks/test_viewer_pages.py
      - js/apps/cam-web/**
      - js/packages/cam-*/**
      - js/package.json
      - js/package-lock.json
      - compose/viewer-image.yml
      - compose/fragments/node-workspace.yml
      - containers/node-deps/**
      - containers/viewer/**
      - tools/viewer_image_build.sh
      - Makefile
  pull_request:
    paths:
      - .github/workflows/viewer-pages-preview.yml
      - tools/viewer_pages.py
      - tests/checks/test_viewer_pages.py
      - js/apps/cam-web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viewer-pages-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out viewer source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false
      - name: Check out the Pages publishing branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
      - name: Resolve the selected local Docker endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(bash source/tools/docker_context.sh 'command line' default undefined '' 0)"
          printf 'CAM_DOCKER_ENDPOINT=%s\n' "$endpoint" >> "$GITHUB_ENV"
      - name: Acquire the exact viewer build and runtime bases
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in containers/node-deps/Dockerfile containers/viewer/Dockerfile; do
            base="$(awk '$1 == "FROM" { print $2 }' "source/$dockerfile")"
            test -n "$base"
            docker --host "$CAM_DOCKER_ENDPOINT" pull "$base"
          done
      - name: Install checksum-locked JavaScript dependencies
        run: make -C source js/deps/install DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=viewer-pages-preview
      - name: Compile using the existing confined viewer image build
        shell: bash
        run: |
          set -euo pipefail
          make -C source viewer/image/build DOCKER_CONTEXT=default VIEWER_IMAGE="viewer-pages-$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
      - name: Extract and validate the relocatable static bundle
        shell: bash
        run: |
          set -euo pipefail
          image="viewer-pages-$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          container="viewer-pages-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker --host "$CAM_DOCKER_ENDPOINT" rm -f "$container" >/dev/null 2>&1 || :
            docker --host "$CAM_DOCKER_ENDPOINT" image rm "$image" >/dev/null 2>&1 || :
          }
          trap cleanup EXIT
          test -s site/viewer/deploy.html
          docker --host "$CAM_DOCKER_ENDPOINT" create --name "$container" --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$image" >/dev/null
          rm -rf -- site/viewer/assets
          docker --host "$CAM_DOCKER_ENDPOINT" cp "$container:/srv/viewer/." site/viewer/
          python3 -B source/tools/viewer_pages.py check site/viewer

      - name: Retain the reviewed static candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: viewer-pages-preview
          path: |
            site/viewer/index.html
            site/viewer/assets/
          retention-days: 1
          if-no-files-found: error
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The documentation publisher uses the same group. Never update the shared
    # Pages branch using two independent, stale checkouts.
    concurrency:
      group: gh-pages-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pages: write
      actions: read
    steps:
      - name: Check out the exact qualified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false

      - name: Check out the independent Pages branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: site
          persist-credentials: true

      - name: Download the exact qualified viewer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: viewer-pages-preview
          path: qualified

      - name: Verify Pages publishes from gh-pages root
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages-settings.json"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          settings = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pages-settings.json").read_text())
          source = settings.get("source")
          if settings.get("build_type") != "legacy" or not isinstance(source, dict) \
                  or source.get("branch") != "gh-pages" or source.get("path") != "/":
              raise SystemExit("Pages must publish gh-pages / in branch mode")
          PY

      - name: Stage and publish only qualified viewer application files
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONPATH=source python3 -B -m tools.pages_integrity current viewer

          # Viewer owns only its index, hashed assets and provenance manifest.
          # Stage records this exact build's source/run and SHA-256 file hashes.
          # Documentation owns deploy.html and the rest of the Pages site.
          entry="$(python3 -B source/tools/viewer_pages.py stage qualified site/viewer "$GITHUB_SHA" "$GITHUB_RUN_ID")"
          echo "entry_js=$entry" >> "$GITHUB_OUTPUT"
          cd site
          # The accompanying provenance manifest is published atomically with
          # the viewer bytes; no other Pages files may enter this commit.
          git add -A -- viewer/index.html viewer/assets viewer/viewer-publication.json
          while IFS= read -r changed_file; do
            case "$changed_file" in
              viewer/index.html|viewer/viewer-publication.json|viewer/assets/*) ;;
              *) echo "::error::Viewer publisher attempted to change $changed_file" >&2; exit 2 ;;
            esac
          done < <(git diff --cached --name-only)
          if git diff --cached --quiet; then
            echo 'Viewer bundle already matches the qualified build.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Publish qualified viewer from $GITHUB_SHA (run $GITHUB_RUN_ID)"
          # Recheck qualification; the non-forced push protects concurrent gh-pages updates.
          PYTHONPATH=../source python3 -B -m tools.pages_integrity current viewer
          git push origin HEAD:refs/heads/gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not cause a Pages branch build automatically.
      - name: Request and verify GitHub Pages deployment
        if: steps.publication.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publication.outputs.published_sha }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > "$RUNNER_TEMP/pages-request.json"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          request = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pages-request.json").read_text())
          if request.get("status") != "queued":
              raise SystemExit(f"Unexpected Pages build request: {request!r}")
          PY
          for attempt in {1..48}; do
            gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" > "$RUNNER_TEMP/pages-result.json"
            if python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          build = json.loads((Path(os.environ["RUNNER_TEMP"]) / "pages-result.json").read_text())
          if build.get("commit") != os.environ["PUBLISHED_SHA"]:
              raise SystemExit(1)
          if build.get("status") == "built":
              print("GitHub Pages confirmed the exact viewer publication commit.")
              raise SystemExit(0)
          if build.get("status") in ("errored", "failed", "canceled"):
              raise SystemExit(f"GitHub Pages build failed: {build.get('error')}")
          raise SystemExit(1)
          PY
            then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages did not confirm commit $PUBLISHED_SHA." >&2
          exit 2

      - name: Verify the published viewer and its JavaScript bundle over HTTPS
        if: steps.publication.outputs.changed == 'true'
        shell: bash
        env:
          VIEWER_ENTRY: ${{ steps.publication.outputs.entry_js }}
        run: |
          set -euo pipefail
          origin="https://numpde.github.io/dapp32/viewer/"
          asset="$origin$(printf '%s' "$VIEWER_ENTRY" | sed 's#^\./##')"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
                -H 'Cache-Control: no-cache' "$origin?revision=$GITHUB_SHA" \
                -o "$RUNNER_TEMP/viewer-live.html" \
                && grep -Fq "$VIEWER_ENTRY" "$RUNNER_TEMP/viewer-live.html" \
                && curl --fail --silent --show-error --max-time 10 "$asset" -o /dev/null; then
              printf 'Verified deployed viewer at %s, entry %s\n' "$origin" "$VIEWER_ENTRY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages did not serve the qualified viewer and entry asset." >&2
          exit 2
