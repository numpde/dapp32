name: Full CI

on:
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!compose/docs.yml'
      - '!tools/make/docs.mk'
      - '!tools/docs_site.py'
      - '!tests/checks/test_docs_*.py'
      - '!.github/workflows/docs-pages-candidate.yml'
      - '!.github/workflows/docs-publish.yml'
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!compose/docs.yml'
      - '!tools/make/docs.mk'
      - '!tools/docs_site.py'
      - '!tests/checks/test_docs_*.py'
      - '!.github/workflows/docs-pages-candidate.yml'
      - '!.github/workflows/docs-publish.yml'

permissions:
  contents: read

concurrency:
  group: full-offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run repository checks
        run: make tests/checks DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=full-offline-ci

  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install checksum-locked Solidity dependencies
        run: make dapps/deps/install DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=full-offline-ci
      - name: Install checksum-locked JavaScript dependencies
        run: make js/deps/install DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=full-offline-ci
      - name: Run Solidity and JavaScript CI campaigns
        run: make ci/qualification DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=full-offline-ci

  installer-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exercise concurrent installers and recovery on Docker
        run: make tests/live/dependency-install DOCKER_CONTEXT=default

  complete-offline-qualification:
    if: always()
    needs: [repository-checks, qualification]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both CI jobs to succeed
        env:
          CHECKS_RESULT: ${{ needs.repository-checks.result }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: test "$CHECKS_RESULT" = success && test "$QUALIFICATION_RESULT" = success
