name: RPC proxy checks

on:
  push:
    branches-ignore: [deploy/viewer]
    tags: ['**']
    paths:
      - .github/workflows/rpc-proxy-checks.yml
      - containers/rpc-proxy/**
      - js/tools/pay-to-play-refunds/**
      - containers/checks/**
      - compose/**
      - tests/live/refund_network.sh
      - '!compose/docs.yml'
      - tests/checks/**
      - '!tests/checks/test_docs_*.py'
      - tests/fixtures/release-rehearsal/**
      - Makefile
      - '!**/README.md'
  pull_request:
    paths:
      - .github/workflows/rpc-proxy-checks.yml
      - containers/rpc-proxy/**
      - js/tools/pay-to-play-refunds/**
      - containers/checks/**
      - compose/**
      - tests/live/refund_network.sh
      - '!compose/docs.yml'
      - tests/checks/**
      - '!tests/checks/test_docs_*.py'
      - tests/fixtures/release-rehearsal/**
      - Makefile
      - '!**/README.md'

permissions:
  contents: read

concurrency:
  group: rpc-proxy-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the offline, resource-limited checks container
        run: make tests/checks DOCKER_CONTEXT=default COMPOSE_PROJECT_NAME=rpc-proxy-checks

  refund-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Acquire pinned Node and dependency staging bases
        run: >-
          make base-images/pull DOCKER_CONTEXT=default
          DOCKERFILES="containers/node-deps/Dockerfile containers/https-egress-proxy/Dockerfile"
      - name: Install locked JavaScript dependencies in confined staging
        run: make js/deps/install DOCKER_CONTEXT=default
      - name: Typecheck and test the actual refund worker
        run: make pay-to-play/refunds/check DOCKER_CONTEXT=default

  refund-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Acquire only digest-pinned proxy and worker bases
        run: >-
          make base-images/pull DOCKER_CONTEXT=default
          DOCKERFILES="containers/node-deps/Dockerfile containers/rpc-proxy/Dockerfile"
      - name: Prove refund worker cannot egress except through its RPC proxy
        run: make pay-to-play/refunds/network/live/check DOCKER_CONTEXT=default
