name: Documentation navigation

on:
  push:
    paths:
      - index.html
      - site.css
      - theme.js
      - check_pages.py
      - check_navigation.mjs
      - check_deployments.mjs
      - viewer/deploy.html
      - 'deployments/**'
      - Makefile
      - .github/workflows/pages-navigation.yml
  pull_request:
    branches: [gh-pages]
    paths:
      - index.html
      - site.css
      - theme.js
      - check_pages.py
      - check_navigation.mjs
      - check_deployments.mjs
      - viewer/deploy.html
      - 'deployments/**'
      - Makefile
      - .github/workflows/pages-navigation.yml

permissions:
  contents: read

concurrency:
  group: pages-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the documentation candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check rendered documentation in an owned browser
        env:
          DOCKER_CONTEXT: default
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          unset -v chrome_pid
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -v chrome_pid ]]; then
              kill "$chrome_pid" 2>/dev/null || :
              wait "$chrome_pid" 2>/dev/null || :
            fi
            rm -rf -- "$scratch"
            exit "$status"
          }
          trap cleanup EXIT
          google-chrome --headless=new --no-first-run --disable-gpu \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir="$scratch/profile" about:blank >"$scratch/chrome.log" 2>&1 &
          chrome_pid=$!
          for attempt in {1..45}; do
            if curl --silent --show-error --fail http://127.0.0.1:9222/json/version > /dev/null 2>&1; then break; fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then
              cat "$scratch/chrome.log"
              exit 1
            fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:9222/json/version > /dev/null
          make pages/navigation/check CDP_ORIGIN=http://127.0.0.1:9222
          make pages/deployments/check CDP_ORIGIN=http://127.0.0.1:9222
