name: Publish qualified documentation
on:
  workflow_dispatch:
    inputs:
      qualified_run_id:
        description: Successful main-branch Docs Pages candidate run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docs-reviewed-publication
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Check out the exact source without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false
      - name: Check out published files for a reviewed replacement
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: site
          persist-credentials: true

      - name: Verify that the selected artifact was qualified for this exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
        run: |
          set -euo pipefail
          [[ "$QUALIFIED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN_ID" > "$RUNNER_TEMP/docs-qualified-run.json"
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads((Path(os.environ["RUNNER_TEMP"]) / "docs-qualified-run.json").read_text())
          if not (
              record["status"] == "completed"
              and record["conclusion"] == "success"
              and record["head_branch"] == "main"
              and record["head_sha"] == os.environ["GITHUB_SHA"]
              and record["event"] in ("push", "workflow_dispatch")
              and record["path"] == ".github/workflows/docs-pages-candidate.yml"
              and record["repository"]["full_name"] == os.environ["GITHUB_REPOSITORY"]
          ):
              raise ValueError("Not a successful documentation qualification of this exact main commit")
          PY
          if git -C site ls-remote --heads origin refs/heads/docs/vitepress-pages-candidate | grep -q .; then
            echo "::error::Review or retire the existing documentation candidate before creating another." >&2
            exit 2
          fi

      - name: Retrieve previously qualified output without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-pages-candidate
          run-id: ${{ inputs.qualified_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: qualified

      - name: Verify and stage documentation without changing the independent viewer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B source/tools/docs_site.py check source/docs qualified
          python3 -B source/tools/docs_site.py stage source/docs qualified site "$GITHUB_SHA" "$QUALIFIED_RUN_ID"
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .
          if git diff --cached --name-only -- viewer/ | grep -v '^viewer/deploy\.html$' | grep -q .; then
            echo 'Docs candidate must not change independently published viewer files.' >&2
            exit 2
          fi
          if git diff --cached --quiet; then
            echo 'Published files already match this qualified documentation artifact.'
            exit 0
          fi
          git commit -m "Publish qualified docs from $GITHUB_SHA (run $QUALIFIED_RUN_ID)"
          branch="docs/vitepress-pages-candidate"
          git push origin "HEAD:refs/heads/$branch"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base gh-pages --head "$branch" \
            --title "Publish qualified documentation $(printf %s "$GITHUB_SHA" | cut -c1-12)" \
            --body "Documentation artifact from successful run $QUALIFIED_RUN_ID of main@$GITHUB_SHA. Generated site and provenance manifest validated; old static documentation checks replaced; independent viewer assets preserved. Review and merge this candidate to publish."; then
            echo "::warning::Candidate is pushed but Actions cannot open the review PR automatically."
            {
              echo '### Review the qualified documentation'
              echo "Source: main@$GITHUB_SHA"
              echo "Build run: $QUALIFIED_RUN_ID"
              echo "Candidate branch: $branch"
              echo "Review: https://github.com/$GITHUB_REPOSITORY/compare/gh-pages...$branch?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
