name: Resolve VitePress lockfile candidate

on:
  push:
    branches: [docs/vitepress-dependencies-20261109]
    paths:
      - .github/workflows/docs-vitepress-lock.yml
      - js/package.json

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Resolve pinned npm packages without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          image="$(awk '$1 == "FROM" { print $2 }' containers/node-deps/Dockerfile)"
          test -n "$image"
          docker pull "$image"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=512m \
            -e npm_config_cache=/tmp/npm-cache \
            -v "$PWD/js:/workspace:rw" -w /workspace \
            "$image" npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm lock is reproducible
        shell: bash
        run: |
          set -euo pipefail
          image="$(awk '$1 == "FROM" { print $2 }' containers/node-deps/Dockerfile)"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=512m \
            -e npm_config_cache=/tmp/npm-cache \
            -v "$PWD/js:/workspace:rw" -w /workspace \
            "$image" npm ci --ignore-scripts --no-audit --no-fund
          test -x js/node_modules/.bin/vitepress
          node --version
      - name: Commit resolved lock to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test -s js/package-lock.json
          git add -- js/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already matches the candidate manifest.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock VitePress 2 dependency graph for documentation build'
          git push origin HEAD:refs/heads/docs/vitepress-dependencies-20261109
