# Foreground signer bridge to an existing local CDP tab. Host networking reaches
# operator-owned loopback endpoints; this lane also has ordinary host egress.
services:
  browser-fixture-wallet:
    sysctls: !reset {}
    extends:
      file: fragments/node-workspace.yml
      service: hardened-node-workspace
    network_mode: host
    cpus: 1
    environment:
      FIXTURE_WALLET_APP: "${FIXTURE_WALLET_APP:?Select an explicit app fixture}"
      CDP_ORIGIN: "${CDP_ORIGIN:?Set the loopback CDP origin}"
      FIXTURE_BROADCAST_PATH: "${FIXTURE_BROADCAST_PATH:?Set the saved demo broadcast path}"
    volumes:
      - type: bind
        source: ../js
        target: /input/js
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../js/node_modules
        target: /work/js/node_modules
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: demo-broadcast
        target: /foundry-broadcast
        read_only: true
    command:
      - run-js-workspace
      - sh
      - -eu
      - -c
      - |
        npm run build:packages
        exec node /work/js/tools/browser-fixture-wallet-attach.mjs

volumes:
  demo-broadcast:
    external: true
    name: "${FIXTURE_BROADCAST_VOLUME:?Select an existing demo broadcast volume}"
