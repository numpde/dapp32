# Foundry runtime posture. Consumers own networks, mounts and deployment scripts.
x-foundry-runtime: &foundry_runtime
  sysctls: {net.mptcp.enabled: "0"}
  build:
    context: ../../containers/foundry
    dockerfile: Dockerfile
  user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
  mem_limit: 1g

services:
  anvil:
    <<: *foundry_runtime
    working_dir: /work
    init: true
    environment:
      HOME: /tmp/home
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    command: [anvil, --host, 0.0.0.0, --port, "8545"]
    healthcheck:
      test: [CMD, cast, block-number, --rpc-url, "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

  local-deployer:
    <<: *foundry_runtime
    working_dir: /work/dapps
    environment:
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
