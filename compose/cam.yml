# CAM resource maintenance lanes.
#
# These services copy the read-only canonical protocol reference into each CAM
# bundle and refresh manifest integrity pins offline. Writable main.json and
# protocol.html outputs are listed explicitly so adding a CAM dapp requires an
# auditable mount change. ABI/UI resources use the read-only dapps mount.
services:
  cam-integrity:
    build:
      context: ../containers/checks
      dockerfile: Dockerfile
    working_dir: /work
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    environment:
      HOME: /tmp/home
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    volumes:
      - ../dapps:/work/dapps:ro
      - ../tools/cam_resource_integrity.py:/work/tools/cam_resource_integrity.py:ro
      - ../tools/json_policy.py:/work/tools/json_policy.py:ro
      - type: bind
        source: ../docs/reference/cam/1.2.0/index.html
        target: /work/docs/reference/cam/1.2.0/index.html
        read_only: true
        bind:
          create_host_path: false
      - ../dapps/bike-nft/cam/main.json:/work/dapps/bike-nft/cam/main.json:rw
      - ../dapps/escrow/cam/main.json:/work/dapps/escrow/cam/main.json:rw
      - type: bind
        source: ../dapps/pay-to-play/cam/main.json
        target: /work/dapps/pay-to-play/cam/main.json
        bind:
          create_host_path: false
      - type: bind
        source: ../dapps/pay-to-play/cam/protocol.html
        target: /work/dapps/pay-to-play/cam/protocol.html
        bind:
          create_host_path: false
      - type: bind
        source: ../dapps/bike-nft/cam/protocol.html
        target: /work/dapps/bike-nft/cam/protocol.html
        bind:
          create_host_path: false
      - type: bind
        source: ../dapps/escrow/cam/protocol.html
        target: /work/dapps/escrow/cam/protocol.html
        bind:
          create_host_path: false
    command:
      - "-I"
      - "-B"
      - "/work/tools/cam_resource_integrity.py"
      - "/work/dapps"
