x-plan-write: &plan_write
  type: bind
  source: "${BIKE_NFT_RELEASE_OUTPUT_DIR:?missing_BIKE_NFT_RELEASE_OUTPUT_DIR}/plan"
  target: /release-plan
  bind: {create_host_path: false}
x-plan-read: &plan_read
  <<: *plan_write
  read_only: true
x-broadcast-write: &broadcast_write
  type: bind
  source: "${BIKE_NFT_RELEASE_OUTPUT_DIR:?missing_BIKE_NFT_RELEASE_OUTPUT_DIR}/broadcast"
  target: /release-broadcast
  bind: {create_host_path: false}
x-broadcast-read: &broadcast_read
  <<: *broadcast_write
  read_only: true
x-artifact-write: &artifact_write
  type: bind
  source: "${BIKE_NFT_RELEASE_OUTPUT_DIR:?missing_BIKE_NFT_RELEASE_OUTPUT_DIR}/artifact"
  target: /release-artifact
  bind: {create_host_path: false}
x-rpc-url-bind: &rpc_url_bind
  type: bind
  source: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"
  target: /run/inputs/rpc_url
  read_only: true
  bind:
    create_host_path: false
x-rpc-proxy: &rpc_proxy
  build:
    context: ../../../containers/rpc-proxy
    dockerfile: Dockerfile
  init: true
  user: "65532:65532"
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 64
  mem_limit: 128m
  environment:
    RPC_PROXY_HOST: 0.0.0.0
    RPC_PROXY_PORT: "8080"
    RPC_PROXY_MAX_REQUEST_BYTES: "16777216"
    RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
    RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
    RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
  tmpfs: [/tmp:rw,nosuid,nodev,noexec,size=16m]
  healthcheck:
    test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"]
    interval: 2s
    timeout: 2s
    retries: 10

services:
  bike-nft-release-plan:
    extends:
      file: ../../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    network_mode: none
    environment: &release_inputs
      BIKE_NFT_RELEASE_DAPPS_ROOT: /work/dapps
      BIKE_NFT_RELEASE_CAM_ROOT_PATH: /work/dapps/bike-nft/cam/main.json
      BIKE_NFT_RELEASE_PLAN_PATH: /release-plan/release-plan.json
      BIKE_NFT_RELEASE_SOURCE_COMMIT: "${BIKE_NFT_RELEASE_SOURCE_COMMIT:?missing_BIKE_NFT_RELEASE_SOURCE_COMMIT}"
      BIKE_NFT_RELEASE_EXPECTED_CHAIN_ID: "${BIKE_NFT_RELEASE_EXPECTED_CHAIN_ID:?missing_BIKE_NFT_RELEASE_EXPECTED_CHAIN_ID}"
      BIKE_NFT_RELEASE_CAM_URI: "${BIKE_NFT_RELEASE_CAM_URI:?missing_BIKE_NFT_RELEASE_CAM_URI}"
      BIKE_NFT_RELEASE_INTENDED_CAM_ROOT_OWNER: "${BIKE_NFT_RELEASE_INTENDED_CAM_ROOT_OWNER:?missing_BIKE_NFT_RELEASE_INTENDED_CAM_ROOT_OWNER}"
      BIKE_NFT_RELEASE_TOKEN_NAME: "${BIKE_NFT_RELEASE_TOKEN_NAME:?missing_BIKE_NFT_RELEASE_TOKEN_NAME}"
      BIKE_NFT_RELEASE_TOKEN_SYMBOL: "${BIKE_NFT_RELEASE_TOKEN_SYMBOL:?missing_BIKE_NFT_RELEASE_TOKEN_SYMBOL}"
      BIKE_NFT_RELEASE_BASE_TOKEN_URI: "${BIKE_NFT_RELEASE_BASE_TOKEN_URI:?missing_BIKE_NFT_RELEASE_BASE_TOKEN_URI}"
      BIKE_NFT_RELEASE_COLLECTION_URI: "${BIKE_NFT_RELEASE_COLLECTION_URI:?missing_BIKE_NFT_RELEASE_COLLECTION_URI}"
      BIKE_NFT_RELEASE_INTENDED_COMPONENTS_ADMIN: "${BIKE_NFT_RELEASE_INTENDED_COMPONENTS_ADMIN:?missing_BIKE_NFT_RELEASE_INTENDED_COMPONENTS_ADMIN}"
      BIKE_NFT_RELEASE_COMPONENTS_ADMIN_DELAY: "${BIKE_NFT_RELEASE_COMPONENTS_ADMIN_DELAY:?missing_BIKE_NFT_RELEASE_COMPONENTS_ADMIN_DELAY}"
      BIKE_NFT_RELEASE_COMPONENTS_PAUSER: "${BIKE_NFT_RELEASE_COMPONENTS_PAUSER:?missing_BIKE_NFT_RELEASE_COMPONENTS_PAUSER}"
      BIKE_NFT_RELEASE_COMPONENTS_CONFIGURER: "${BIKE_NFT_RELEASE_COMPONENTS_CONFIGURER:?missing_BIKE_NFT_RELEASE_COMPONENTS_CONFIGURER}"
      BIKE_NFT_RELEASE_INTENDED_MANAGER_ADMIN: "${BIKE_NFT_RELEASE_INTENDED_MANAGER_ADMIN:?missing_BIKE_NFT_RELEASE_INTENDED_MANAGER_ADMIN}"
      BIKE_NFT_RELEASE_MANAGER_ADMIN_DELAY: "${BIKE_NFT_RELEASE_MANAGER_ADMIN_DELAY:?missing_BIKE_NFT_RELEASE_MANAGER_ADMIN_DELAY}"
      BIKE_NFT_RELEASE_MANAGER_PAUSER: "${BIKE_NFT_RELEASE_MANAGER_PAUSER:?missing_BIKE_NFT_RELEASE_MANAGER_PAUSER}"
      BIKE_NFT_RELEASE_MANAGER_CONFIGURER: "${BIKE_NFT_RELEASE_MANAGER_CONFIGURER:?missing_BIKE_NFT_RELEASE_MANAGER_CONFIGURER}"
      BIKE_NFT_RELEASE_REGISTRARS: "${BIKE_NFT_RELEASE_REGISTRARS:?missing_BIKE_NFT_RELEASE_REGISTRARS}"
    volumes:
      - ../../../dapps:/work/dapps:ro
      - ../../../js:/input/js:ro
      - ../../../js/node_modules:/work/js/node_modules:ro
      - *plan_write
    command: [run-js-workspace, sh, -eu, -c, "npm run build:workspace && ./node_modules/.bin/tsc -p tools/bike-nft-release/tsconfig.json && node --experimental-strip-types tools/bike-nft-release/plan.ts"]

  bike-nft-release-rpc-proxy:
    <<: *rpc_proxy
    environment:
      RPC_PROXY_HOST: 0.0.0.0
      RPC_PROXY_PORT: "8080"
      RPC_UPSTREAM_FILE: /run/secrets/rpc_url
      RPC_PROXY_MAX_REQUEST_BYTES: "16777216"
      RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
      RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
      RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getBlockByNumber eth_getBlockByHash
        eth_getBalance eth_getTransactionCount eth_getStorageAt eth_getProof
        eth_gasPrice eth_maxPriorityFeePerGas eth_feeHistory eth_estimateGas
        eth_createAccessList eth_call eth_getCode eth_sendRawTransaction
        eth_getTransactionReceipt eth_getTransactionByHash
    secrets: [{source: rpc_url, target: rpc_url}]
    networks:
      bike_nft_release_deploy_internal: {aliases: [bike-nft-release-rpc-proxy]}
      bike_nft_release_deploy_egress: {}

  deploy-bike-nft-release:
    build:
      context: ../../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work/dapps
    depends_on:
      bike-nft-release-plan: {condition: service_completed_successfully}
      bike-nft-release-rpc-proxy: {condition: service_healthy}
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 1g
    environment:
      <<: *release_inputs
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
      FOUNDRY_BROADCAST: /release-broadcast
    secrets: [{source: deployer_private_key, target: deployer_private_key}]
    tmpfs: [/tmp:rw,nosuid,nodev,noexec,size=512m]
    volumes:
      - ../../../dapps:/work/dapps:ro
      - *plan_read
      - *broadcast_write
    networks: [bike_nft_release_deploy_internal]
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        umask 077
        private_key="$$(< /run/secrets/deployer_private_key)"
        if [[ ! "$${private_key}" =~ ^0x[0-9a-fA-F]{64}$$ ]]; then
          printf '%s\n' 'deployer private-key secret must contain exactly one 32-byte hex key' >&2
          exit 2
        fi
        PRIVATE_KEY="$${private_key}" forge script --offline bike-nft/script/DeployBikeNftRelease.s.sol --rpc-url http://bike-nft-release-rpc-proxy:8080 --broadcast -vvv

  bike-nft-release-artifact-rpc-proxy:
    <<: *rpc_proxy
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    environment:
      RPC_PROXY_HOST: 0.0.0.0
      RPC_PROXY_PORT: "8080"
      RPC_UPSTREAM_FILE: /run/inputs/rpc_url
      RPC_PROXY_MAX_REQUEST_BYTES: "1048576"
      RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
      RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
      RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
      RPC_ALLOWED_METHODS: eth_chainId eth_blockNumber eth_getTransactionReceipt eth_getCode eth_call
    volumes: [*rpc_url_bind]
    networks:
      bike_nft_release_artifact_internal: {aliases: [bike-nft-release-artifact-rpc-proxy]}
      bike_nft_release_artifact_egress: {}

  bike-nft-release-artifact:
    extends:
      file: ../../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    depends_on:
      deploy-bike-nft-release: {condition: service_completed_successfully}
      bike-nft-release-artifact-rpc-proxy: {condition: service_healthy}
    environment:
      BIKE_NFT_RELEASE_PLAN_PATH: /release-plan/release-plan.json
      BIKE_NFT_RELEASE_BROADCAST_DIR: /release-broadcast
      BIKE_NFT_DEPLOYMENT_ARTIFACT_PATH: /release-artifact/deployment.json
      BIKE_NFT_RELEASE_RPC_URL: http://bike-nft-release-artifact-rpc-proxy:8080
    volumes:
      - ../../../js:/input/js:ro
      - ../../../js/node_modules:/work/js/node_modules:ro
      - *plan_read
      - *broadcast_read
      - *artifact_write
    networks: [bike_nft_release_artifact_internal]
    command: [run-js-workspace, sh, -eu, -c, "npm run build:workspace && ./node_modules/.bin/tsc -p tools/bike-nft-release/tsconfig.json && node --experimental-strip-types tools/bike-nft-release/artifact.ts"]

secrets:
  rpc_url: {file: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"}
  deployer_private_key: {file: "${DEPLOYER_PRIVATE_KEY_FILE:?missing_DEPLOYER_PRIVATE_KEY_FILE}"}
networks:
  bike_nft_release_deploy_internal: {internal: true}
  bike_nft_release_deploy_egress: {}
  bike_nft_release_artifact_internal: {internal: true}
  bike_nft_release_artifact_egress: {}
