services:
  release-check:
    sysctls: {net.mptcp.enabled: "0"}
    environment:
      RELEASE_TOOL_DIR: tools/ui-release
    command:
      - run-js-workspace
      - sh
      - -eu
      - -c
      - |
        npm run build:packages
        ./node_modules/.bin/tsc -p tools/ui-release/tsconfig.json
        node --test --experimental-strip-types tools/ui-release/*.test.ts
