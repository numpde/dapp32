services:
  release-check:
    environment:
      RELEASE_TOOL_DIR: tools/ui-release
    command:
      - run-js-workspace
      - sh
      - -eu
      - -c
      - |
        npm run build:packages
        ./node_modules/.bin/tsc -p tools/ui-release/tsconfig.json
        node --test --experimental-strip-types tools/execution-ownership.test.mjs tools/ui-release/*.test.ts
