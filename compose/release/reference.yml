# Offline compiler export and reference preparation for an approval release.
services:
  release-reference-export:
    build:
      context: ../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work/dapps
    init: true
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    ulimits:
      core: 0
    environment:
      RELEASE_OPERATION: "${RELEASE_OPERATION:?missing_RELEASE_OPERATION}"
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
    depends_on:
      release-plan:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    volumes:
      - ../../dapps:/work/dapps:ro
      - ../../js/tools/release-approval/reference-export.sh:/usr/local/bin/reference-export:ro
      - type: bind
        source: "${RELEASE_APPROVAL_ARTIFACTS_DIR:?missing_RELEASE_APPROVAL_ARTIFACTS_DIR}"
        target: /reference-artifacts
        bind:
          create_host_path: false
    command:
      - sh
      - /usr/local/bin/reference-export
      - "${RELEASE_APPROVAL_APP:?missing_RELEASE_APPROVAL_APP}"
      - /reference-artifacts

  release-reference-prepare:
    extends:
      file: ../fragments/node-workspace.yml
      service: offline-node-workspace
    working_dir: /work
    init: true
    cpus: 1
    memswap_limit: 1g
    ulimits:
      core: 0
    depends_on:
      release-plan:
        condition: service_completed_successfully
      release-reference-export:
        condition: service_completed_successfully
    environment:
      RELEASE_APPROVAL_APP: "${RELEASE_APPROVAL_APP:?missing_RELEASE_APPROVAL_APP}"
      RELEASE_APPROVAL_EXPECTED_DEPLOYER: "${RELEASE_APPROVAL_DEPLOYER:?missing_RELEASE_APPROVAL_DEPLOYER}"
      RELEASE_APPROVAL_PLAN_PATH: /release-plan/release-plan.json
      RELEASE_APPROVAL_ARTIFACTS_ROOT: /reference-artifacts
      RELEASE_APPROVAL_SOURCES_ROOT: /work/dapps
      RELEASE_APPROVAL_REFERENCE_PATH: /reference-out/reference.json
    volumes:
      - ../../js:/input/js:ro
      - ../../js/node_modules:/work/js/node_modules:ro
      - ../../dapps:/work/dapps:ro
      - type: bind
        source: "${RELEASE_OUTPUT_DIR:?missing_RELEASE_OUTPUT_DIR}/plan"
        target: /release-plan
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RELEASE_APPROVAL_ARTIFACTS_DIR:?missing_RELEASE_APPROVAL_ARTIFACTS_DIR}"
        target: /reference-artifacts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RELEASE_APPROVAL_REFERENCE_DIR:?missing_RELEASE_APPROVAL_REFERENCE_DIR}"
        target: /reference-out
        bind:
          create_host_path: false
    command:
      - run-js-workspace
      - sh
      - -eu
      - -c
      - |
        npm run build:packages
        ./node_modules/.bin/tsc -p tools/release-approval/tsconfig.json
        node --experimental-strip-types tools/release-approval/reference-prepare.ts
