# Verification keeps its normal artifact snapshot and read-only RPC methods.
services:
  verify-input:
    environment:
      RELEASE_REHEARSAL: "1"
  verify-rpc-proxy:
    entrypoint: [python3, /rehearsal/rpc_proxy.py]
    volumes:
      - ../../tests/fixtures/release-rehearsal/rpc_proxy.py:/rehearsal/rpc_proxy.py:ro

networks:
  release_verify_egress:
    external: true
    name: "${RELEASE_REHEARSAL_NETWORK:?missing_RELEASE_REHEARSAL_NETWORK}"
