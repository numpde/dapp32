# Shared release phase boundaries; app overlays supply settings and entrypoints.

x-deployment-artifact: &deployment_artifact
  type: bind
  source: "${RELEASE_DEPLOYMENT_ARTIFACT_FILE:?missing_RELEASE_DEPLOYMENT_ARTIFACT_FILE}"
  target: /deployment/deployment.json
  read_only: true
  bind:
    create_host_path: false

x-verified-write: &verified_write
  type: volume
  source: release_verified
  target: /out
  volume:
    nocopy: false

x-verified-read: &verified_read
  type: volume
  source: release_verified
  target: /out
  read_only: true
  volume:
    nocopy: true

x-node-modules: &node_modules
  type: bind
  source: ../../js/node_modules
  target: /work/js/node_modules
  read_only: true
  bind:
    create_host_path: false

services:
  verify-input:
    environment:
      RELEASE_REHEARSAL: "0"
    extends:
      file: ../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    network_mode: "none"
    volumes:
      - ../../dapps:/work/dapps:ro
      - ../../js:/input/js:ro
      - *node_modules
      - *deployment_artifact
      - *verified_write
    command:
      - "run-js-workspace"
      - "sh"
      - "-eu"
      - "-c"
      - |
        npm run build:workspace
        ./node_modules/.bin/tsc -p "$${RELEASE_TOOL_DIR}/tsconfig.json"
        node --experimental-strip-types "$${RELEASE_TOOL_DIR}/verify-input.ts"

  verify-rpc-proxy:
    build:
      context: ../../containers/rpc-proxy
      dockerfile: Dockerfile
    init: true
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    environment:
      RPC_PROXY_HOST: 0.0.0.0
      RPC_PROXY_PORT: "8080"
      RPC_UPSTREAM_FILE: /run/secrets/rpc_url
      RPC_PROXY_MAX_REQUEST_BYTES: "1048576"
      RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
      RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
      RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getBlockByNumber eth_getBalance eth_gasPrice
        eth_getTransactionCount eth_getStorageAt eth_call eth_getCode
        eth_getTransactionReceipt eth_getTransactionByHash
    secrets:
      - source: rpc_url
        target: rpc_url
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    networks:
      release_verify_internal:
        aliases:
          - verify-rpc-proxy
      release_verify_egress: {}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"
      interval: 2s
      timeout: 2s
      retries: 10

  verify-provenance:
    extends:
      file: ../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    depends_on:
      verify-input:
        condition: service_completed_successfully
      verify-rpc-proxy:
        condition: service_healthy
    volumes:
      - ../../js:/input/js:ro
      - *node_modules
      - *verified_read
    networks:
      - release_verify_internal
    command:
      - "run-js-workspace"
      - "sh"
      - "-eu"
      - "-c"
      - |
        npm run build:workspace
        ./node_modules/.bin/tsc -p "$${RELEASE_TOOL_DIR}/tsconfig.json"
        node --experimental-strip-types "$${RELEASE_TOOL_DIR}/verify-provenance.ts"

  verify-release:
    build:
      context: ../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work/dapps
    depends_on:
      verify-provenance:
        condition: service_completed_successfully
      verify-rpc-proxy:
        condition: service_healthy
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    environment:
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    volumes:
      - ../../dapps:/work/dapps:ro
      - *verified_read
    networks:
      - release_verify_internal
    command: [bash, -lc, 'exec forge script --offline "$${RELEASE_SCRIPT}" --skip test --rpc-url http://verify-rpc-proxy:8080 -vvv']

secrets:
  rpc_url:
    file: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"

networks:
  release_verify_internal:
    internal: true
  release_verify_egress: {}

volumes:
  release_verified: {}
