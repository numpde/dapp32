# Fresh read-only admission creates both plan and reference with the same in-memory facts.
services:
  release-reference-export:
    depends_on: !reset []
  release-reference-prepare:
    network_mode: !reset null
    networks: [release_artifact_internal]
    depends_on: !override
      release-reference-export: {condition: service_completed_successfully}
      release-artifact-rpc-proxy: {condition: service_healthy}
    environment:
      CAM_RELEASE_APP: "${CAM_RELEASE_APP:?missing_CAM_RELEASE_APP}"
      CAM_RELEASE_SOURCE_COMMIT: "${CAM_RELEASE_SOURCE_COMMIT:?missing_CAM_RELEASE_SOURCE_COMMIT}"
      CAM_RELEASE_EXPECTED_CHAIN_ID: "${CAM_RELEASE_EXPECTED_CHAIN_ID:?missing_CAM_RELEASE_EXPECTED_CHAIN_ID}"
      CAM_RELEASE_SIGNER_ADDRESS: "${CAM_RELEASE_SIGNER_ADDRESS:?missing_CAM_RELEASE_SIGNER_ADDRESS}"
      CAM_RELEASE_URI: "${CAM_RELEASE_URI:?missing_CAM_RELEASE_URI}"
      CAM_RELEASE_INTENDED_OWNER: "${CAM_RELEASE_INTENDED_OWNER:?missing_CAM_RELEASE_INTENDED_OWNER}"
      CAM_RELEASE_ROOT: "${CAM_RELEASE_ROOT:?missing_CAM_RELEASE_ROOT}"
      CAM_RELEASE_PREPARED_DIR: /prepared
      CAM_RELEASE_ROOT_ARTIFACT_PATH: /root-origin/root.json
      CAM_RELEASE_RPC_URL: http://release-artifact-rpc-proxy:8080
      CAM_RELEASE_PLAN_PATH: /release-plan/release-plan.json
      RELEASE_REHEARSAL: "${RELEASE_REHEARSAL-0}"
    volumes: !override
      - "${RELEASE_SOURCE_DIR:?missing_RELEASE_SOURCE_DIR}/js:/input/js:ro"
      - "${RELEASE_SOURCE_DIR:?missing_RELEASE_SOURCE_DIR}/js/node_modules:/work/js/node_modules:ro"
      - "${RELEASE_SOURCE_DIR:?missing_RELEASE_SOURCE_DIR}/dapps:/work/dapps:ro"
      - type: bind
        source: "${CAM_RELEASE_PREPARED_DIR:?missing_CAM_RELEASE_PREPARED_DIR}"
        target: /prepared
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${CAM_RELEASE_ROOT_ARTIFACT_FILE:?missing_CAM_RELEASE_ROOT_ARTIFACT_FILE}"
        target: /root-origin/root.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${RELEASE_OUTPUT_DIR:?missing_RELEASE_OUTPUT_DIR}/plan"
        target: /release-plan
        bind: {create_host_path: false}
      - type: bind
        source: "${RELEASE_APPROVAL_ARTIFACTS_DIR:?missing_RELEASE_APPROVAL_ARTIFACTS_DIR}"
        target: /reference-artifacts
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${RELEASE_APPROVAL_REFERENCE_DIR:?missing_RELEASE_APPROVAL_REFERENCE_DIR}"
        target: /reference-out
        bind: {create_host_path: false}
    command: [run-js-workspace, sh, -eu, -c, 'npm run build:packages; ./node_modules/.bin/tsc -p tools/cam-release/tsconfig.json; node --experimental-strip-types tools/cam-release/plan.ts']
  release-rpc-proxy:
    depends_on: !reset []
  deploy-release:
    depends_on: !reset []
    environment:
      RELEASE_SCRIPT: cam/script/PublishCam.s.sol
      CAM_PUBLICATION_PLAN_PATH: /release-plan/release-plan.json
