# Shared release phase boundaries; app overlays supply settings and entrypoints.

x-plan-write: &plan_write
  type: bind
  source: "${RELEASE_OUTPUT_DIR:?missing_RELEASE_OUTPUT_DIR}/plan"
  target: /release-plan
  bind:
    create_host_path: false
x-plan-read: &plan_read
  <<: *plan_write
  read_only: true
x-broadcast-write: &broadcast_write
  type: bind
  source: "${RELEASE_OUTPUT_DIR:?missing_RELEASE_OUTPUT_DIR}/broadcast"
  target: /release-broadcast
  bind:
    create_host_path: false
x-broadcast-read: &broadcast_read
  <<: *broadcast_write
  read_only: true
x-artifact-write: &artifact_write
  type: bind
  source: "${RELEASE_OUTPUT_DIR:?missing_RELEASE_OUTPUT_DIR}/artifact"
  target: /release-artifact
  bind:
    create_host_path: false

x-rpc-url-bind: &rpc_url_bind
  type: bind
  source: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"
  target: /run/inputs/rpc_url
  read_only: true
  bind:
    create_host_path: false

x-rpc-proxy-base: &rpc_proxy_base
  build:
    context: ../../containers/rpc-proxy
    dockerfile: Dockerfile
  init: true
  user: "65532:65532"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 64
  mem_limit: 128m
  environment:
    RPC_PROXY_HOST: 0.0.0.0
    RPC_PROXY_PORT: "8080"
    RPC_UPSTREAM_FILE: /run/secrets/rpc_url
    RPC_PROXY_MAX_REQUEST_BYTES: "16777216"
    RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
    RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
    RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"
    interval: 2s
    timeout: 2s
    retries: 10

services:
  release-plan:
    environment:
      RELEASE_REHEARSAL: "0"
    extends:
      file: ../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    network_mode: "none"
    volumes:
      - ../../dapps:/work/dapps:ro
      - ../../js:/input/js:ro
      - ../../js/node_modules:/work/js/node_modules:ro
      - *plan_write
    command:
      - "run-js-workspace"
      - "sh"
      - "-eu"
      - "-c"
      - |
        npm run build:workspace
        ./node_modules/.bin/tsc -p "$${RELEASE_TOOL_DIR}/tsconfig.json"
        node --experimental-strip-types "$${RELEASE_TOOL_DIR}/plan.ts"

  release-rpc-proxy:
    <<: *rpc_proxy_base
    environment:
      RPC_PROXY_HOST: 0.0.0.0
      RPC_PROXY_PORT: "8080"
      RPC_UPSTREAM_FILE: /run/secrets/rpc_url
      RPC_PROXY_MAX_REQUEST_BYTES: "16777216"
      RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
      RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
      RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getBlockByNumber eth_getBlockByHash
        eth_getBalance eth_getTransactionCount eth_getStorageAt eth_getProof
        eth_gasPrice eth_maxPriorityFeePerGas eth_feeHistory eth_estimateGas
        eth_createAccessList eth_call eth_getCode eth_sendRawTransaction
        eth_getTransactionReceipt eth_getTransactionByHash
    secrets:
      - source: rpc_url
        target: rpc_url
    networks:
      release_deploy_internal:
        aliases:
          - release-rpc-proxy
      release_deploy_egress: {}

  deploy-release:
    build:
      context: ../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work/dapps
    depends_on:
      release-plan:
        condition: service_completed_successfully
      release-rpc-proxy:
        condition: service_healthy
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    environment:
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
      FOUNDRY_BROADCAST: /release-broadcast
    secrets:
      - source: deployer_private_key
        target: deployer_private_key
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    volumes:
      - ../../dapps:/work/dapps:ro
      - *plan_read
      - *broadcast_write
    networks:
      - release_deploy_internal
    command:
      - "bash"
      - "-lc"
      - |
        set -euo pipefail
        umask 077
        private_key="$$(< /run/secrets/deployer_private_key)"
        if [[ ! "$${private_key}" =~ ^0x[0-9a-fA-F]{64}$$ ]]; then
          printf '%s\n' 'deployer private-key secret must contain exactly one 32-byte hex key' >&2
          exit 2
        fi
        PRIVATE_KEY="$${private_key}" forge script --offline "$${RELEASE_SCRIPT}" \
          --rpc-url http://release-rpc-proxy:8080 \
          --broadcast \
          -vvv

  release-artifact-rpc-proxy:
    <<: *rpc_proxy_base
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    environment:
      RPC_PROXY_HOST: 0.0.0.0
      RPC_PROXY_PORT: "8080"
      RPC_UPSTREAM_FILE: /run/inputs/rpc_url
      RPC_PROXY_MAX_REQUEST_BYTES: "1048576"
      RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
      RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
      RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getTransactionReceipt eth_getTransactionByHash eth_getCode eth_call
    volumes:
      - *rpc_url_bind
    networks:
      release_artifact_internal:
        aliases:
          - release-artifact-rpc-proxy
      release_artifact_egress: {}

  release-artifact:
    extends:
      file: ../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    depends_on:
      deploy-release:
        condition: service_completed_successfully
      release-artifact-rpc-proxy:
        condition: service_healthy
    volumes:
      - ../../js:/input/js:ro
      - ../../js/node_modules:/work/js/node_modules:ro
      - *plan_read
      - *broadcast_read
      - *artifact_write
    networks:
      - release_artifact_internal
    command:
      - "run-js-workspace"
      - "sh"
      - "-eu"
      - "-c"
      - |
        npm run build:workspace
        ./node_modules/.bin/tsc -p "$${RELEASE_TOOL_DIR}/tsconfig.json"
        node --experimental-strip-types "$${RELEASE_TOOL_DIR}/artifact.ts"

secrets:
  rpc_url:
    file: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"
  deployer_private_key:
    file: "${DEPLOYER_PRIVATE_KEY_FILE:?missing_DEPLOYER_PRIVATE_KEY_FILE}"

networks:
  release_deploy_internal:
    internal: true
  release_deploy_egress: {}
  release_artifact_internal:
    internal: true
  release_artifact_egress: {}
