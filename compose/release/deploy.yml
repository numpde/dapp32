# Shared release phase boundaries; app overlays supply settings and entrypoints.

x-plan-write: &plan_write
  type: bind
  source: "${RELEASE_OUTPUT_DIR:?missing_RELEASE_OUTPUT_DIR}/plan"
  target: /release-plan
  bind:
    create_host_path: false
x-plan-read: &plan_read
  <<: *plan_write
  read_only: true
x-broadcast-write: &broadcast_write
  type: bind
  source: "${RELEASE_OUTPUT_DIR:?missing_RELEASE_OUTPUT_DIR}/broadcast"
  target: /release-broadcast
  bind:
    create_host_path: false
services:
  release-plan:
    environment:
      RELEASE_REHEARSAL: "0"
    extends:
      file: ../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    network_mode: "none"
    init: true
    cpus: 1
    memswap_limit: 1g
    ulimits:
      core: 0
    volumes:
      - ../../js:/input/js:ro
      - ../../js/node_modules:/work/js/node_modules:ro
      - *plan_write
    command:
      - timeout
      - --signal=TERM
      - --kill-after=10s
      - 300s
      - "run-js-workspace"
      - "sh"
      - "-eu"
      - "-c"
      - |
        npm run build:packages
        ./node_modules/.bin/tsc -p "$${RELEASE_TOOL_DIR}/tsconfig.json"
        node --experimental-strip-types "$${RELEASE_TOOL_DIR}/plan.ts"

  release-rpc-proxy:
    extends:
      file: ../fragments/release-rpc-proxy.yml
      service: release-rpc-proxy-base
    depends_on:
      release-plan:
        condition: service_completed_successfully
    environment:
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getBlockByNumber eth_getBlockByHash
        eth_getBalance eth_getTransactionCount eth_getStorageAt eth_getProof
        eth_gasPrice eth_maxPriorityFeePerGas eth_feeHistory eth_estimateGas
        eth_createAccessList eth_call eth_getCode eth_sendRawTransaction
        eth_getTransactionReceipt eth_getTransactionByHash
    secrets:
      - source: rpc_url
        target: rpc_url
    networks:
      release_deploy_internal:
        aliases:
          - release-rpc-proxy
      release_deploy_egress: {}

  deploy-release:
    build:
      context: ../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work/dapps
    init: true
    cpus: 1
    memswap_limit: 1g
    ulimits:
      core: 0
    depends_on:
      release-plan:
        condition: service_completed_successfully
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    environment:
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
      FOUNDRY_BROADCAST: /release-broadcast
    secrets:
      - source: deployer_private_key
        target: deployer_private_key
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    volumes:
      - ../../dapps:/work/dapps:ro
      - *plan_read
      - *broadcast_write
    network_mode: "none"
    command:
      - "bash"
      - "-lc"
      - |
        set -euo pipefail
        set +x
        umask 077
        private_key="$$(< /run/secrets/deployer_private_key)"
        if [[ ! "$${private_key}" =~ ^0x[0-9a-fA-F]{64}$$ ]]; then
          printf '%s\n' 'deployer private-key secret must contain exactly one 32-byte hex key' >&2
          exit 2
        fi
        PRIVATE_KEY="$${private_key}" exec forge script --offline "$${RELEASE_SCRIPT}" --skip test \
          --rpc-url file:///run/approval/rpc.sock \
          --broadcast --slow \
          -vvv


  release-artifact:
    depends_on:
      deploy-release:
        condition: service_completed_successfully
  release-artifact-rpc-proxy:
    depends_on:
      release-plan:
        condition: service_completed_successfully

secrets:
  rpc_url:
    file: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"
  deployer_private_key:
    file: "${DEPLOYER_PRIVATE_KEY_FILE:?missing_DEPLOYER_PRIVATE_KEY_FILE}"

networks:
  release_deploy_internal:
    internal: true
  release_deploy_egress: {}
