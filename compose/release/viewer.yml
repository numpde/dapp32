# Attach a browser to an existing release. No chain lifecycle or signer.
services:
  viewer-url:
    extends:
      file: ../fragments/node-workspace.yml
      service: offline-node-workspace
    working_dir: /work/js
    environment:
      RELEASE_VIEWER_APP: "${RELEASE_VIEWER_APP-}"
      RELEASE_VIEWER_ORIGIN: "${RELEASE_VIEWER_ORIGIN:?missing_RELEASE_VIEWER_ORIGIN}"
      RELEASE_VIEWER_RESOURCE_ORIGIN: "${RELEASE_VIEWER_RESOURCE_ORIGIN-}"
      RELEASE_VIEWER_RPC_URL: "${RELEASE_VIEWER_RPC_URL-}"
      RELEASE_VIEWER_INTERACTIVE: "${RELEASE_VIEWER_INTERACTIVE-0}"
    volumes:
      - ../../js:/input/js:ro
      - ../../js/node_modules:/work/js/node_modules:ro
      - type: bind
        source: "${RELEASE_VIEWER_ARTIFACT:?Set DEPLOYMENT_ARTIFACT_FILE}"
        target: /deployment/deployment.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../../tools/rpc-catalog.json
        target: /catalog/rpc-catalog.json
        read_only: true
        bind: {create_host_path: false}
    command:
      - run-js-workspace
      - sh
      - -eu
      - -c
      - |
        npm run build:packages >/dev/null
        ./node_modules/.bin/tsc -p tools/pay-to-play-release/tsconfig.json >&2
        exec node --experimental-strip-types tools/release-viewer-url.ts

  cam-web:
    extends:
      file: ../fragments/browser-viewer.yml
      service: cam-web
    environment:
      VITE_CAM_WEB_RESOURCE_ORIGIN: "${RELEASE_VIEWER_RESOURCE_ORIGIN-}"
      CAM_WEB_DEV_ORIGIN: "${RELEASE_VIEWER_ORIGIN:?missing_RELEASE_VIEWER_ORIGIN}"
    networks: [viewer_internal]

  browser-gateway:
    extends:
      file: ../fragments/browser-viewer.yml
      service: browser-gateway
    init: true
    depends_on:
      cam-web: {condition: service_started}
    cpus: 1
    # Docker needs a non-internal bridge to activate the loopback published
    # port. Only this gateway gains that network's ordinary egress authority.
    networks: [viewer_internal, browser_ingress]
    ports:
      - "127.0.0.1:${RELEASE_VIEWER_PORT:?missing_RELEASE_VIEWER_PORT}:8080"
    command:
      - sh
      - -eu
      - -c
      - |
        printf '%s\n' "$${VIEWER_RPC_LOCATION-}" >/tmp/viewer-rpc.conf
        cat >/tmp/nginx.conf <<'NGINX'
        pid /tmp/nginx.pid;
        worker_processes 1;
        events { worker_connections 256; }
        http {
          include /etc/nginx/browser-http.conf;
          server {
            listen 8080;
            add_header Cache-Control "no-store" always;
            include /tmp/viewer-rpc.conf;
            location / {
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://cam-web:5173;
            }
          }
        }
        NGINX
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'

networks:
  viewer_internal:
    internal: true
  browser_ingress:
    internal: false
