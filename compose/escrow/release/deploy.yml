# App-specific release inputs; phase boundaries are owned by compose/release/.
services:
  release-plan:
    volumes:
      - type: bind
        source: ../../dapps/escrow/cam
        target: /work/dapps/escrow/cam
        read_only: true
        bind:
          create_host_path: false
    environment:
      RELEASE_TOOL_DIR: tools/escrow-release
      ESCROW_RELEASE_DAPPS_ROOT: /work/dapps
      ESCROW_RELEASE_CAM_ROOT_PATH: /work/dapps/escrow/cam/main.json
      ESCROW_RELEASE_PLAN_PATH: /release-plan/release-plan.json
      ESCROW_RELEASE_CAM_URI: "${ESCROW_RELEASE_CAM_URI:?missing_ESCROW_RELEASE_CAM_URI}"
      ESCROW_RELEASE_CAM_HASH: "${ESCROW_RELEASE_CAM_HASH-auto}"
      ESCROW_RELEASE_EXPECTED_CHAIN_ID: "${ESCROW_RELEASE_EXPECTED_CHAIN_ID:?missing_ESCROW_RELEASE_EXPECTED_CHAIN_ID}"
      ESCROW_RELEASE_INTENDED_CAM_ROOT_OWNER: "${ESCROW_RELEASE_INTENDED_CAM_ROOT_OWNER:?missing_ESCROW_RELEASE_INTENDED_CAM_ROOT_OWNER}"
      ESCROW_RELEASE_SOURCE_COMMIT: "${ESCROW_RELEASE_SOURCE_COMMIT:?missing_ESCROW_RELEASE_SOURCE_COMMIT}"
  deploy-release:
    environment:
      RELEASE_SCRIPT: escrow/script/DeployEscrowRelease.s.sol
      ESCROW_RELEASE_SOURCE_COMMIT: "${ESCROW_RELEASE_SOURCE_COMMIT:?missing_ESCROW_RELEASE_SOURCE_COMMIT}"
      ESCROW_RELEASE_EXPECTED_CHAIN_ID: "${ESCROW_RELEASE_EXPECTED_CHAIN_ID:?missing_ESCROW_RELEASE_EXPECTED_CHAIN_ID}"
      ESCROW_RELEASE_CAM_URI: "${ESCROW_RELEASE_CAM_URI:?missing_ESCROW_RELEASE_CAM_URI}"
      ESCROW_RELEASE_INTENDED_CAM_ROOT_OWNER: "${ESCROW_RELEASE_INTENDED_CAM_ROOT_OWNER:?missing_ESCROW_RELEASE_INTENDED_CAM_ROOT_OWNER}"
      ESCROW_RELEASE_PLAN_PATH: /release-plan/release-plan.json
