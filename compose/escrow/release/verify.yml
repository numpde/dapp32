# Read-only verification for one escrow deployment artifact.
#
# The offline input service binds deployment.json and its strict companion to
# the current source/CAM bytes. The live verifier receives no signing key and
# can reach only a proxy whose allowlist excludes transaction submission.

x-deployment-artifact: &deployment_artifact
  type: bind
  source: "${ESCROW_DEPLOYMENT_ARTIFACT_FILE:?missing_ESCROW_DEPLOYMENT_ARTIFACT_FILE}"
  target: /deployment/deployment.json
  read_only: true
  bind:
    create_host_path: false

x-deployment-arguments: &deployment_arguments
  type: bind
  source: "${ESCROW_DEPLOYMENT_ARTIFACT_FILE:?missing_ESCROW_DEPLOYMENT_ARTIFACT_FILE}.args"
  target: /deployment/deployment.args
  read_only: true
  bind:
    create_host_path: false

services:
  escrow-release-verify-input:
    extends:
      file: ../../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    network_mode: "none"
    environment:
      ESCROW_RELEASE_DAPPS_ROOT: /work/dapps
      ESCROW_RELEASE_CAM_ROOT_PATH: /work/dapps/escrow/cam/main.json
      ESCROW_DEPLOYMENT_ARTIFACT_PATH: /deployment/deployment.json
      ESCROW_DEPLOYMENT_ARGUMENTS_PATH: /deployment/deployment.args
      ESCROW_RELEASE_EXPECTED_SOURCE_COMMIT: "${ESCROW_RELEASE_EXPECTED_SOURCE_COMMIT:?missing_ESCROW_RELEASE_EXPECTED_SOURCE_COMMIT}"
    volumes:
      - ../../../dapps:/work/dapps:ro
      - ../../../js:/input/js:ro
      - ../../../js/node_modules:/work/js/node_modules:ro
      - *deployment_artifact
      - *deployment_arguments
    command:
      - "run-js-workspace"
      - "sh"
      - "-eu"
      - "-c"
      - |
        npm run build:workspace
        ./node_modules/.bin/tsc -p tools/escrow-release/tsconfig.json
        node --experimental-strip-types tools/escrow-release/verify-input.ts

  escrow-release-verify-rpc-proxy:
    build:
      context: ../../../containers/rpc-proxy
      dockerfile: Dockerfile
    init: true
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    environment:
      RPC_PROXY_HOST: 0.0.0.0
      RPC_PROXY_PORT: "8080"
      RPC_UPSTREAM_FILE: /run/secrets/rpc_url
      RPC_PROXY_MAX_REQUEST_BYTES: "1048576"
      RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
      RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
      RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "20"
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getBlockByNumber eth_getBalance
        eth_getTransactionCount eth_getStorageAt eth_call eth_getCode
    secrets:
      - source: rpc_url
        target: rpc_url
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    networks:
      escrow_release_verify_internal:
        aliases:
          - escrow-release-verify-rpc-proxy
      escrow_release_verify_egress: {}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"
      interval: 2s
      timeout: 2s
      retries: 10

  verify-escrow-release:
    build:
      context: ../../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work/dapps
    depends_on:
      escrow-release-verify-input:
        condition: service_completed_successfully
      escrow-release-verify-rpc-proxy:
        condition: service_healthy
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    environment:
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
      ESCROW_RELEASE_EXPECTED_SOURCE_COMMIT: "${ESCROW_RELEASE_EXPECTED_SOURCE_COMMIT:?missing_ESCROW_RELEASE_EXPECTED_SOURCE_COMMIT}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    volumes:
      - ../../../dapps:/work/dapps:ro
      - *deployment_arguments
    networks:
      - escrow_release_verify_internal
    command:
      - "bash"
      - "-lc"
      - |
        set -euo pipefail
        mapfile -t deployment < /deployment/deployment.args
        if [[ "$${#deployment[@]}" -ne 12 || "$${deployment[0]}" != "escrow.deployment.v1" ]]; then
          printf '%s\n' 'deployment.args must contain the exact twelve-field deployment record' >&2
          exit 2
        fi
        export ESCROW_DEPLOYMENT_SCHEMA="$${deployment[0]}"
        export ESCROW_DEPLOYMENT_SOURCE_COMMIT="$${deployment[1]}"
        export ESCROW_DEPLOYMENT_CHAIN_ID="$${deployment[2]}"
        export ESCROW_DEPLOYMENT_CAM_URI="$${deployment[3]}"
        export ESCROW_DEPLOYMENT_CAM_HASH="$${deployment[4]}"
        export ESCROW_DEPLOYMENT_CAM_ROOT_OWNER="$${deployment[5]}"
        export ESCROW_DEPLOYMENT_CAM_ROOT="$${deployment[6]}"
        export ESCROW_DEPLOYMENT_CAM_ESCROW="$${deployment[7]}"
        export ESCROW_DEPLOYMENT_CAM_ESCROW_UI="$${deployment[8]}"
        export ESCROW_DEPLOYMENT_CAM_ROOT_CODE_HASH="$${deployment[9]}"
        export ESCROW_DEPLOYMENT_CAM_ESCROW_CODE_HASH="$${deployment[10]}"
        export ESCROW_DEPLOYMENT_CAM_ESCROW_UI_CODE_HASH="$${deployment[11]}"
        forge script --offline escrow/script/VerifyEscrowRelease.s.sol \
          --rpc-url http://escrow-release-verify-rpc-proxy:8080 \
          -vvv

secrets:
  rpc_url:
    file: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"

networks:
  escrow_release_verify_internal:
    internal: true
  escrow_release_verify_egress: {}
