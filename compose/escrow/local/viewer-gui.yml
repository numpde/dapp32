# Local escrow graphical viewer scenario.
#
# Compose this with deploy.yml and http.yml. One unprivileged gateway exposes the
# generic CAM web app, local Anvil RPC, and checked-in escrow CAM resources:
#
#   /      -> cam-web
#   /rpc   -> escrow-anvil
#   /cam/  -> escrow-cam-http
#
# The query starts with the deployment client as viewer identity. Actual writes
# remain controlled by the injected browser wallet; switching wallet accounts
# exercises contractor and arbitrator views through the ordinary app boundary.
services:
  cam-web:
    extends:
      file: ../../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work/js
    depends_on:
      escrow-cam-http:
        condition: service_healthy
    environment:
      VITE_CAM_WEB_ALLOW_UNSIGNED_CAM_HASH: "false"
      VITE_CAM_WEB_RESOURCE_ORIGIN: "${CAM_VIEWER_RESOURCE_ORIGIN:?missing_CAM_VIEWER_RESOURCE_ORIGIN}"
      CAM_WEB_DEV_ORIGIN: "${ESCROW_GUI_ORIGIN:?missing_ESCROW_GUI_ORIGIN}"
    volumes:
      - ../../../js:/input/js:ro
      - ../../../js/node_modules:/work/js/node_modules:ro
    networks:
      - escrow_local
    command:
      - "run-js-workspace"
      - "sh"
      - "-eu"
      - "-c"
      - |
        npm run build:workspace
        npm run dev -w cam-web -- --host 0.0.0.0 --port 5173 --strictPort

  escrow-browser-gateway:
    image: ghcr.io/nginx/nginx-unprivileged:1.31.1-alpine3.23@sha256:8122337ed6c475bb486bc9340da453d4599f225e6b920ff0d92ca2267486b9b5
    depends_on:
      escrow-anvil:
        condition: service_healthy
      escrow-cam-http:
        condition: service_healthy
      cam-web:
        condition: service_started
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    networks:
      - escrow_local
      - escrow_browser
    ports:
      - "${ESCROW_GUI_BIND_HOST:?missing_ESCROW_GUI_BIND_HOST}:${ESCROW_GUI_PORT:?missing_ESCROW_GUI_PORT}:8080"
    command:
      - "/bin/sh"
      - "-eu"
      - "-c"
      - |
        cat >/tmp/nginx.conf <<'NGINX'
        pid /tmp/nginx.pid;
        worker_processes 1;

        events {
          worker_connections 256;
        }

        http {
          access_log /dev/stdout;
          error_log /dev/stderr info;
          client_body_temp_path /tmp/client_body;
          fastcgi_temp_path /tmp/fastcgi;
          proxy_temp_path /tmp/proxy;
          scgi_temp_path /tmp/scgi;
          uwsgi_temp_path /tmp/uwsgi;

          server {
            listen 8080;
            add_header Cache-Control "no-store" always;

            location = /rpc {
              proxy_pass http://escrow-anvil:8545/;
            }

            location /rpc/ {
              rewrite ^/rpc/(.*)$ /$1 break;
              proxy_pass http://escrow-anvil:8545;
            }

            location /cam/ {
              proxy_pass http://escrow-cam-http:8080/;
            }

            location / {
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://cam-web:5173;
            }
          }
        }
        NGINX
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'

  escrow-viewer-url:
    image: docker.io/library/python:3.13-alpine@sha256:420cd0bf0f3998275875e02ecd5808168cf0843cbb4d3c536432f729247b2acc
    working_dir: /work
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    environment:
      GUI_URL: "${ESCROW_GUI_ORIGIN:?missing_ESCROW_GUI_ORIGIN}/"
      RPC_URL: "${ESCROW_GUI_ORIGIN:?missing_ESCROW_GUI_ORIGIN}/rpc"
      CHAIN_ID: "eip155:31337"
      BROADCAST_PATH: "${ESCROW_BROADCAST_PATH:?missing_ESCROW_BROADCAST_PATH}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    volumes:
      - "escrow_broadcast:${ESCROW_BROADCAST_DIR:?missing_ESCROW_BROADCAST_DIR}:ro"
    command:
      - "python3"
      - "-I"
      - "-B"
      - "-c"
      - |
        import json
        import os
        import re
        from urllib.parse import urlencode

        EVM_ADDRESS_RE = re.compile(r"^0x[0-9a-fA-F]{40}$")

        def reject_json_constant(value):
            raise ValueError(f"non-standard JSON constant is not allowed: {value}")

        def reject_duplicate_json_keys(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    raise ValueError(f"duplicate JSON object key is not allowed: {key}")
                result[key] = value
            return result

        with open(os.environ["BROADCAST_PATH"], "r", encoding="utf-8") as handle:
            broadcast = json.load(
                handle,
                object_pairs_hook=reject_duplicate_json_keys,
                parse_constant=reject_json_constant,
            )

        transactions = broadcast.get("transactions")
        receipts = broadcast.get("receipts")
        if not isinstance(transactions, list) or not isinstance(receipts, list):
            raise SystemExit("Forge broadcast output must contain transactions and receipts arrays")

        roots = [tx for tx in transactions if isinstance(tx, dict) and tx.get("contractName") == "CamRoot"]
        if len(roots) != 1:
            raise SystemExit("Forge broadcast output must contain exactly one CamRoot transaction")
        root = roots[0]
        host = root.get("contractAddress")
        tx_hash = root.get("hash")
        if not isinstance(host, str) or EVM_ADDRESS_RE.fullmatch(host) is None:
            raise SystemExit("CamRoot contractAddress not found in Forge broadcast output")

        senders = {
            receipt.get("from")
            for receipt in receipts
            if isinstance(receipt, dict) and receipt.get("transactionHash") == tx_hash
        }
        if len(senders) != 1:
            raise SystemExit("Forge broadcast must identify one CamRoot deployment sender")
        account = next(iter(senders))
        if not isinstance(account, str) or EVM_ADDRESS_RE.fullmatch(account) is None:
            raise SystemExit("CamRoot deployment sender is not an EVM address")

        query = urlencode({
            "chainId": os.environ["CHAIN_ID"],
            "host": host,
            "account": account,
            "rpcUrl": os.environ["RPC_URL"],
        })
        print(f"{os.environ['GUI_URL']}?{query}")

networks:
  escrow_local:
    internal: true
  escrow_browser:
