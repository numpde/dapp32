# Offline VitePress 2 build. Acquire locked npm dependencies through the
# existing js/deps/install lane; this service never installs or fetches them.
services:
  docs-build:
    extends:
      file: fragments/node-workspace.yml
      service: offline-node-workspace
    image: dapp32-docs-builder:local
    pull_policy: build
    build:
      context: ../containers/node-deps
      dockerfile: Dockerfile
      network: none
    init: true
    working_dir: /work/js
    volumes:
      - type: bind
        source: ../docs
        target: /input/docs
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ../js/node_modules
        target: /work/js/node_modules
        read_only: true
        bind: { create_host_path: false }
      # Only Docker-managed storage is writable by the documentation build.
      - type: volume
        source: docs-artifact
        target: /out
    command:
      - sh
      - -eu
      - -c
      - |
        rm -rf /out/site
        cp -a /input/docs /work/js/docs
        exec node_modules/.bin/vitepress build docs --base /dapp32/ --outDir /out/site

  docs-export:
    extends:
      file: fragments/node-workspace.yml
      service: offline-node-workspace
    volumes:
      - type: volume
        source: docs-artifact
        target: /artifact
        read_only: true
      - type: bind
        source: ${DOCS_OUTPUT_DIR:?missing_DOCS_OUTPUT_DIR}
        target: /export
        bind: { create_host_path: false }
    command:
      - sh
      - -eu
      - -c
      - |
        test -f /artifact/site/index.html
        test ! -e /export/site
        cp -a /artifact/site /export/site

volumes:
  docs-artifact: {}
