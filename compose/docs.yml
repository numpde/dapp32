# Offline VitePress 2 build. Acquire locked npm dependencies through the
# existing js/deps/install lane; this service never installs or fetches them.
services:
  docs-build:
    extends:
      file: fragments/node-workspace.yml
      service: offline-node-workspace
    image: dapp32-docs-builder:local
    pull_policy: build
    build:
      context: ../containers/node-deps
      dockerfile: Dockerfile
      network: none
    init: true
    working_dir: /work/js
    volumes:
      - type: bind
        source: ../docs
        target: /input/docs
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ../js/node_modules
        target: /work/js/node_modules
        read_only: true
        bind: { create_host_path: false }
      # Supply an existing, dedicated empty directory for the build output.
      - type: bind
        source: ${DOCS_OUTPUT_DIR:?missing_DOCS_OUTPUT_DIR}
        target: /out
        bind: { create_host_path: false }
    command:
      - sh
      - -eu
      - -c
      - |
        cp -a /input/docs /work/js/docs
        exec node_modules/.bin/vitepress build docs --base /dapp32/ --outDir /out
