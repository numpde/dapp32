# Long-running read-only RPC boundary. Each Compose project owns one upstream
# and one private client network. Only this proxy joins the egress network.
services:
  rpc-proxy:
    sysctls: {net.mptcp.enabled: "0"}
    build:
      context: ../containers/rpc-proxy
      dockerfile: Dockerfile
    init: true
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    ulimits:
      core: 0
    stop_grace_period: 10s
    environment:
      RPC_PROXY_HOST: 0.0.0.0
      RPC_PROXY_PORT: "8080"
      RPC_UPSTREAM_FILE: /run/inputs/rpc_url
      RPC_PROXY_MAX_REQUEST_BYTES: "1048576"
      RPC_PROXY_MAX_RESPONSE_BYTES: "16777216"
      RPC_PROXY_MAX_UPSTREAM_URL_BYTES: "4096"
      RPC_PROXY_CONNECT_TIMEOUT_SECONDS: "10"
      RPC_PROXY_UPSTREAM_TIMEOUT_SECONDS: "60"
      RPC_PROXY_REQUEST_TIMEOUT_SECONDS: "90"
      RPC_PROXY_MAX_CONCURRENT_REQUESTS: "4"
      RPC_PROXY_MAX_BATCH_ITEMS: "100"
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getBlockByNumber eth_getLogs
    volumes:
      - type: bind
        source: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"
        target: /run/inputs/rpc_url
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    networks:
      rpc_internal:
        aliases:
          - "${RPC_INDEXER_COMPOSE_PROJECT_NAME:?missing_RPC_INDEXER_COMPOSE_PROJECT_NAME}-rpc"
      rpc_egress: {}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).close()"
      interval: 10s
      timeout: 2s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  rpc_internal:
    internal: true
  rpc_egress: {}
