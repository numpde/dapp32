# CAM ABI export lanes.
#
# ABI export has a different boundary from normal Forge checks: it consumes a
# temporary manifest plan and writes only generated cam/abi files. Keep it out of
# compose/forge.yml so routine build/test/fuzz lanes do not need ABI_PLAN_DIR.
x-offline-hardened: &offline_hardened
  sysctls: {net.mptcp.enabled: "0"}
  working_dir: /work/dapps
  user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
  read_only: true
  network_mode: "none"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  mem_limit: 1g
  environment:
    HOME: /tmp/home
    XDG_DATA_HOME: /usr/local/share
    FOUNDRY_CACHE_PATH: /tmp/foundry-cache
    FOUNDRY_CONFIG: /work/dapps/foundry.toml
    FOUNDRY_OUT: /tmp/foundry-out
    FOUNDRY_BROADCAST: /tmp/foundry-broadcast
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=512m

x-forge-base: &forge_base
  <<: *offline_hardened
  build:
    context: ../containers/foundry
    dockerfile: Dockerfile
  volumes:
    - ../dapps:/work/dapps:ro

services:
  # Structured planning keeps CAM JSON parsing in Python instead of scraping
  # manifests with sed/awk inside a Forge shell.
  forge-abi-plan:
    <<: *offline_hardened
    build:
      context: ../containers/checks
      dockerfile: Dockerfile
    working_dir: /work
    volumes:
      - ../dapps:/work/dapps:ro
      - ../tools/cam_abi_plan.py:/work/tools/cam_abi_plan.py:ro
      - ../tools/cam_resource_integrity.py:/work/tools/cam_resource_integrity.py:ro
      - ../tools/forge-abi-plan.py:/work/tools/forge-abi-plan.py:ro
      - ../tools/json_policy.py:/work/tools/json_policy.py:ro
      - ${ABI_PLAN_DIR:?missing_ABI_PLAN_DIR}:/work/abi-plan:rw
    command:
      - "-I"
      - "-B"
      - "/work/tools/forge-abi-plan.py"
      - "/work/dapps"
      - "/work/abi-plan/manifest.tsv"

  # Compare the pinned compiler's exact export bytes without writable ABI mounts.
  forge-abi-check:
    <<: *forge_base
    volumes:
      - ${ABI_PLAN_DIR:?missing_ABI_PLAN_DIR}:/work/abi-plan:ro
      - ../dapps:/work/dapps:ro
    command:
      - "sh"
      - "-eu"
      - "-c"
      - |
        plan="/work/abi-plan/manifest.tsv"
        if [ ! -s "$$plan" ]; then
          printf '%s\n' 'forge-abi-check: missing ABI export plan' >&2
          exit 2
        fi
        while IFS="	" read -r dapp inspect_target abi_name; do
          output="$$dapp/cam/abi/$$abi_name"
          if [ ! -f "$$output" ] || [ ! -r "$$output" ]; then
            printf 'forge-abi-check: cannot read declared ABI: %s\n' "$$output" >&2
            exit 1
          fi
          forge inspect --json "$$inspect_target" abi > /tmp/generated-abi.json
          if ! cmp -s /tmp/generated-abi.json "$$output"; then
            printf 'forge-abi-check: %s differs from its compiled contract; run make cam/abi/export\n' "$$output" >&2
            exit 1
          fi
        done < "$$plan"

  # Only dapps listed by forge-abi-plan participate. Outputs are staged in tmpfs
  # first so a failed inspection does not erase the last good ABI set.
  forge-abi:
    <<: *forge_base
    volumes:
      - ${ABI_PLAN_DIR:?missing_ABI_PLAN_DIR}:/work/abi-plan:ro
      - ../dapps:/work/dapps:ro
      - type: bind
        source: ../dapps/bike-nft/cam/abi
        target: /work/dapps/bike-nft/cam/abi
        bind:
          create_host_path: false
      - type: bind
        source: ../dapps/escrow/cam/abi
        target: /work/dapps/escrow/cam/abi
        bind:
          create_host_path: false
      - type: bind
        source: ../dapps/pay-to-play/cam/abi
        target: /work/dapps/pay-to-play/cam/abi
        bind:
          create_host_path: false
    command:
      - "sh"
      - "-eu"
      - "-c"
      - |
        plan="/work/abi-plan/manifest.tsv"
        if [ ! -s "$$plan" ]; then
          printf '%s\n' 'forge-abi: missing ABI export plan; run forge-abi-plan first' >&2
          exit 2
        fi

        # Check all planned outputs before inspecting or clearing any ABI.
        while IFS="	" read -r dapp inspect_target abi_name; do
          abi_dir="$$dapp/cam/abi"
          if [ -z "$$dapp" ] || [ -z "$$inspect_target" ] || [ -z "$$abi_name" ] || [ ! -d "$$abi_dir" ] || [ ! -w "$$abi_dir" ]; then
            printf 'forge-abi: planned ABI output is not an existing writable directory: %s\n' "$$abi_dir" >&2
            exit 2
          fi
          if [ "$$(id -u)" = 0 ] && [ "$$(stat -c %u "$$abi_dir")" != 0 ]; then
            printf 'forge-abi: rootless ABI output is not owned by the selected engine user: %s\n' "$$abi_dir" >&2
            exit 2
          fi
        done < "$$plan"

        staged_root="$$(mktemp -d)"

        while IFS="	" read -r dapp inspect_target abi_name; do
          mkdir -p "$$staged_root/$$dapp"
          forge inspect --json "$$inspect_target" abi > "$$staged_root/$$dapp/$$abi_name"
        done < "$$plan"

        while IFS="	" read -r dapp inspect_target abi_name; do
          abi_dir="$$dapp/cam/abi"

          if [ ! -e "$$staged_root/$$dapp/.cleared" ]; then
            touch "$$staged_root/$$dapp/.cleared"
            find "$$abi_dir" -maxdepth 1 -type f -name '*.json' -delete
          fi

          mv "$$staged_root/$$dapp/$$abi_name" "$$abi_dir/$$abi_name"
          printf 'forge-abi: wrote %s\n' "$$abi_dir/$$abi_name"
        done < "$$plan"
