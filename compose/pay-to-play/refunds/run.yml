# Explicit operator RPC lane. Default is a read-only refund plan; the signing
# grant is in execute.yml and is never loaded by the plan/check targets.
services:
  pay-to-play-refunds:
    extends:
      file: ../../fragments/node-workspace.yml
      service: hardened-node-workspace
    working_dir: /work
    depends_on:
      refund-rpc-proxy:
        condition: service_healthy
    networks:
      - refund_rpc_internal
    environment:
      REFUND_EXECUTE: "NO"
      REFUND_CONFIG_FILE: /run/secrets/refund-config
      RPC_URL_FILE: /run/secrets/refund-rpc
    volumes:
      - ../../../js:/input/js:ro
      - ../../../js/node_modules:/work/js/node_modules:ro
      - ../../../dapps/pay-to-play/cam/abi:/work/dapps/pay-to-play/cam/abi:ro
      - type: bind
        source: "${REFUND_CONFIG_FILE:?missing_REFUND_CONFIG_FILE}"
        target: /run/secrets/refund-config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./rpc-proxy-url.txt
        target: /run/secrets/refund-rpc
        read_only: true
        bind:
          create_host_path: false
    command:
      - run-js-workspace
      - sh
      - -eu
      - -c
      - |
        npm run build -w @cam/protocol -w @cam/core -w @cam/evm-viem
        ./node_modules/.bin/tsc -p tools/pay-to-play-refunds/tsconfig.json
        node --experimental-strip-types tools/pay-to-play-refunds/runner.ts

  refund-rpc-proxy:
    extends:
      file: ../../fragments/release-rpc-proxy.yml
      service: release-rpc-proxy-base
    environment:
      RPC_ALLOWED_METHODS: >-
        eth_chainId eth_blockNumber eth_getBlockByNumber eth_getCode
        eth_getLogs eth_call eth_getTransactionCount eth_estimateGas
        eth_getTransactionReceipt eth_getTransactionByHash
        eth_feeHistory eth_gasPrice eth_maxPriorityFeePerGas
    secrets:
      - source: refund_rpc_url
        target: rpc_url
    networks:
      refund_rpc_internal:
        aliases:
          - refund-rpc-proxy
      refund_rpc_egress: {}

secrets:
  refund_rpc_url:
    file: "${RPC_URL_FILE:?missing_RPC_URL_FILE}"

networks:
  refund_rpc_internal:
    internal: true
  refund_rpc_egress: {}
