# App-specific release inputs; phase boundaries are owned by compose/release/.
services:
  verify-input:
    environment:
      RELEASE_TOOL_DIR: tools/pay-to-play-release
      PAY_TO_PLAY_RELEASE_DAPPS_ROOT: /work/dapps
      PAY_TO_PLAY_RELEASE_CAM_ROOT_PATH: /work/dapps/pay-to-play/cam/main.json
      PAY_TO_PLAY_DEPLOYMENT_ARTIFACT_PATH: /deployment/deployment.json
      PAY_TO_PLAY_VERIFIED_ARTIFACT_PATH: /out/deployment.json
      PAY_TO_PLAY_RELEASE_EXPECTED_SOURCE_COMMIT: "${PAY_TO_PLAY_RELEASE_EXPECTED_SOURCE_COMMIT:?missing_PAY_TO_PLAY_RELEASE_EXPECTED_SOURCE_COMMIT}"
  verify-provenance:
    environment:
      RELEASE_TOOL_DIR: tools/pay-to-play-release
      PAY_TO_PLAY_DEPLOYMENT_ARTIFACT_PATH: /out/deployment.json
      PAY_TO_PLAY_RELEASE_RPC_URL: http://verify-rpc-proxy:8080
  verify-release:
    environment:
      RELEASE_SCRIPT: pay-to-play/script/VerifyPayToPlayRelease.s.sol
      PAY_TO_PLAY_VERIFIED_DEPLOYMENT_PATH: /out/deployment.json
      PAY_TO_PLAY_RELEASE_EXPECTED_SOURCE_COMMIT: "${PAY_TO_PLAY_RELEASE_EXPECTED_SOURCE_COMMIT:?missing_PAY_TO_PLAY_RELEASE_EXPECTED_SOURCE_COMMIT}"
