# App-specific release inputs; phase boundaries are owned by compose/release/.
services:
  release-plan:
    volumes:
      - type: bind
        source: ../../dapps/pay-to-play/cam
        target: /work/dapps/pay-to-play/cam
        read_only: true
        bind:
          create_host_path: false
    environment:
      RELEASE_TOOL_DIR: tools/pay-to-play-release
      PAY_TO_PLAY_RELEASE_DAPPS_ROOT: /work/dapps
      PAY_TO_PLAY_RELEASE_CAM_ROOT_PATH: /work/dapps/pay-to-play/cam/main.json
      PAY_TO_PLAY_RELEASE_PLAN_PATH: /release-plan/release-plan.json
      PAY_TO_PLAY_RELEASE_CAM_URI: "${PAY_TO_PLAY_RELEASE_CAM_URI:?missing_PAY_TO_PLAY_RELEASE_CAM_URI}"
      PAY_TO_PLAY_RELEASE_EXPECTED_CHAIN_ID: "${PAY_TO_PLAY_RELEASE_EXPECTED_CHAIN_ID:?missing_PAY_TO_PLAY_RELEASE_EXPECTED_CHAIN_ID}"
      PAY_TO_PLAY_RELEASE_INTENDED_CAM_ROOT_OWNER: "${PAY_TO_PLAY_RELEASE_INTENDED_CAM_ROOT_OWNER:?missing_PAY_TO_PLAY_RELEASE_INTENDED_CAM_ROOT_OWNER}"
      PAY_TO_PLAY_RELEASE_INTENDED_PAYMENT_ADMIN: "${PAY_TO_PLAY_RELEASE_INTENDED_PAYMENT_ADMIN:?missing_PAY_TO_PLAY_RELEASE_INTENDED_PAYMENT_ADMIN}"
      PAY_TO_PLAY_RELEASE_NULL_CLAIM_PERIOD: "${PAY_TO_PLAY_RELEASE_NULL_CLAIM_PERIOD:?missing_PAY_TO_PLAY_RELEASE_NULL_CLAIM_PERIOD}"
      PAY_TO_PLAY_RELEASE_SOURCE_COMMIT: "${PAY_TO_PLAY_RELEASE_SOURCE_COMMIT:?missing_PAY_TO_PLAY_RELEASE_SOURCE_COMMIT}"
  deploy-release:
    environment:
      RELEASE_SCRIPT: pay-to-play/script/DeployPayToPlayRelease.s.sol
      PAY_TO_PLAY_RELEASE_SOURCE_COMMIT: "${PAY_TO_PLAY_RELEASE_SOURCE_COMMIT:?missing_PAY_TO_PLAY_RELEASE_SOURCE_COMMIT}"
      PAY_TO_PLAY_RELEASE_EXPECTED_CHAIN_ID: "${PAY_TO_PLAY_RELEASE_EXPECTED_CHAIN_ID:?missing_PAY_TO_PLAY_RELEASE_EXPECTED_CHAIN_ID}"
      PAY_TO_PLAY_RELEASE_CAM_URI: "${PAY_TO_PLAY_RELEASE_CAM_URI:?missing_PAY_TO_PLAY_RELEASE_CAM_URI}"
      PAY_TO_PLAY_RELEASE_INTENDED_CAM_ROOT_OWNER: "${PAY_TO_PLAY_RELEASE_INTENDED_CAM_ROOT_OWNER:?missing_PAY_TO_PLAY_RELEASE_INTENDED_CAM_ROOT_OWNER}"
      PAY_TO_PLAY_RELEASE_INTENDED_PAYMENT_ADMIN: "${PAY_TO_PLAY_RELEASE_INTENDED_PAYMENT_ADMIN:?missing_PAY_TO_PLAY_RELEASE_INTENDED_PAYMENT_ADMIN}"
      PAY_TO_PLAY_RELEASE_NULL_CLAIM_PERIOD: "${PAY_TO_PLAY_RELEASE_NULL_CLAIM_PERIOD:?missing_PAY_TO_PLAY_RELEASE_NULL_CLAIM_PERIOD}"
      PAY_TO_PLAY_RELEASE_PLAN_PATH: /release-plan/release-plan.json
  release-artifact:
    environment:
      RELEASE_TOOL_DIR: tools/pay-to-play-release
      PAY_TO_PLAY_RELEASE_PLAN_PATH: /release-plan/release-plan.json
      PAY_TO_PLAY_RELEASE_BROADCAST_DIR: /release-broadcast
      PAY_TO_PLAY_DEPLOYMENT_ARTIFACT_PATH: /release-artifact/deployment.json
      PAY_TO_PLAY_RELEASE_RPC_URL: http://release-artifact-rpc-proxy:8080
