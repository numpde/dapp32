# Disposable local pay-to-play chain and CAM deployment. Keys are public fixture values.
services:
  pay-to-play-anvil:
    build:
      context: ../../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work
    init: true
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    environment:
      HOME: /tmp/home
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    networks:
      - pay-to-play_local
    command:
      - "anvil"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8545"
    healthcheck:
      test:
        - "CMD"
        - "cast"
        - "block-number"
        - "--rpc-url"
        - "http://127.0.0.1:8545"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

  deploy-pay-to-play-local:
    build:
      context: ../../../containers/foundry
      dockerfile: Dockerfile
    working_dir: /work/dapps
    depends_on:
      pay-to-play-anvil:
        condition: service_healthy
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    environment:
      HOME: /tmp/home
      XDG_DATA_HOME: /usr/local/share
      FOUNDRY_CACHE_PATH: /tmp/foundry-cache
      FOUNDRY_CONFIG: /work/dapps/foundry.toml
      FOUNDRY_OUT: /tmp/foundry-out
      FOUNDRY_BROADCAST: "${PAY_TO_PLAY_BROADCAST_DIR:?missing_PAY_TO_PLAY_BROADCAST_DIR}"
      CAM_URI: "${CAM_URI:?missing_CAM_URI}"
      PRIVATE_KEY: "0xbabababababababababababababababababababababababababababababababa"
      PAY_TO_PLAY_CUSTOMER_PRIVATE_KEY: "0xcacacacacacacacacacacacacacacacacacacacacacacacacacacacacacacaca"
      PAY_TO_PLAY_RELAYER_PRIVATE_KEY: "0xdadadadadadadadadadadadadadadadadadadadadadadadadadadadadadadada"
      PAY_TO_PLAY_PAYEE_PRIVATE_KEY: "0xfafafafafafafafafafafafafafafafafafafafafafafafafafafafafafafafa"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=512m
    volumes:
      - ../../../dapps/foundry.toml:/work/dapps/foundry.toml:ro
      - ../../../dapps/remappings.txt:/work/dapps/remappings.txt:ro
      - ../../../dapps/dependencies:/work/dapps/dependencies:ro
      - ../../../dapps/pay-to-play/src:/work/dapps/pay-to-play/src:ro
      - ../../../dapps/pay-to-play/script:/work/dapps/pay-to-play/script:ro
      - ../../../dapps/pay-to-play/cam/main.json:/work/dapps/pay-to-play/cam/main.json:ro
      - ../../../dapps/cam/src:/work/dapps/cam/src:ro
      - "pay-to-play_broadcast:${PAY_TO_PLAY_BROADCAST_DIR:?missing_PAY_TO_PLAY_BROADCAST_DIR}"
    networks:
      - pay-to-play_local
    command:
      - "bash"
      - "-lc"
      - |
        set -euo pipefail
        for key in \
          "$${PRIVATE_KEY}" \
          "$${PAY_TO_PLAY_CUSTOMER_PRIVATE_KEY}" \
          "$${PAY_TO_PLAY_RELAYER_PRIVATE_KEY}" \
          "$${PAY_TO_PLAY_PAYEE_PRIVATE_KEY}"
        do
          account="$(cast wallet address --private-key "$${key}")"
          cast rpc anvil_setBalance "$${account}" 0x3635C9ADC5DEA00000 \
            --rpc-url http://pay-to-play-anvil:8545 >/dev/null
        done

        forge script --offline pay-to-play/script/DeployPayToPlayLocal.s.sol \
          --rpc-url http://pay-to-play-anvil:8545 \
          --broadcast \
          -vvv

networks:
  pay-to-play_local:
    internal: true

volumes:
  pay-to-play_broadcast:
