# Generic CAM browser viewer for the disposable local payment-channel fixture.
services:
  cam-web:
    extends:
      file: ../../fragments/browser-viewer.yml
      service: cam-web
    depends_on:
      pay-to-play-cam-http:
        condition: service_healthy
    environment:
      VITE_CAM_WEB_RESOURCE_ORIGIN: "${CAM_VIEWER_RESOURCE_ORIGIN:?missing_CAM_VIEWER_RESOURCE_ORIGIN}"
      CAM_WEB_DEV_ORIGIN: "${PAY_TO_PLAY_GUI_ORIGIN:?missing_PAY_TO_PLAY_GUI_ORIGIN}"
    networks:
      - pay-to-play_local

  pay-to-play-browser-gateway:
    extends:
      file: ../../fragments/browser-viewer.yml
      service: browser-gateway
    depends_on:
      pay-to-play-anvil:
        condition: service_healthy
      pay-to-play-cam-http:
        condition: service_healthy
      cam-web:
        condition: service_started
    networks:
      - pay-to-play_local
      - pay-to-play_browser
    ports:
      - "${PAY_TO_PLAY_GUI_BIND_HOST:?missing_PAY_TO_PLAY_GUI_BIND_HOST}:${PAY_TO_PLAY_GUI_PORT:?missing_PAY_TO_PLAY_GUI_PORT}:8080"
    command:
      - "/bin/sh"
      - "-eu"
      - "-c"
      - |
        cat >/tmp/nginx.conf <<'NGINX'
        pid /tmp/nginx.pid;
        worker_processes 1;

        events {
          worker_connections 256;
        }

        http {
          include /etc/nginx/browser-http.conf;

          server {
            listen 8080;
            add_header Cache-Control "no-store" always;

            location = /rpc {
              proxy_pass http://pay-to-play-anvil:8545/;
            }

            location /rpc/ {
              rewrite ^/rpc/(.*)$ /$1 break;
              proxy_pass http://pay-to-play-anvil:8545;
            }

            location /cam/ {
              proxy_pass http://pay-to-play-cam-http:8080/;
            }

            location / {
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_pass http://cam-web:5173;
            }
          }
        }
        NGINX
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'

  pay-to-play-viewer-url:
    sysctls: {net.mptcp.enabled: "0"}
    image: docker.io/library/python:3.13-alpine@sha256:420cd0bf0f3998275875e02ecd5808168cf0843cbb4d3c536432f729247b2acc
    working_dir: /work
    user: "${LOCAL_UID:?missing_LOCAL_UID}:${LOCAL_GID:?missing_LOCAL_GID}"
    read_only: true
    network_mode: "none"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    environment:
      GUI_URL: "${PAY_TO_PLAY_GUI_ORIGIN:?missing_PAY_TO_PLAY_GUI_ORIGIN}/"
      RPC_URL: "${PAY_TO_PLAY_GUI_ORIGIN:?missing_PAY_TO_PLAY_GUI_ORIGIN}/rpc"
      CHAIN_ID: "eip155:31337"
      BROADCAST_PATH: "${PAY_TO_PLAY_BROADCAST_PATH:?missing_PAY_TO_PLAY_BROADCAST_PATH}"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    volumes:
      - "pay-to-play_broadcast:${PAY_TO_PLAY_BROADCAST_DIR:?missing_PAY_TO_PLAY_BROADCAST_DIR}:ro"
    command:
      - "python3"
      - "-I"
      - "-B"
      - "-c"
      - |
        import json
        import os
        import re
        from urllib.parse import urlencode

        EVM_ADDRESS_RE = re.compile(r"^0x[0-9a-fA-F]{40}$")

        def reject_json_constant(value):
            raise ValueError(f"non-standard JSON constant is not allowed: {value}")

        def reject_duplicate_json_keys(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    raise ValueError(f"duplicate JSON object key is not allowed: {key}")
                result[key] = value
            return result

        with open(os.environ["BROADCAST_PATH"], "r", encoding="utf-8") as handle:
            broadcast = json.load(
                handle,
                object_pairs_hook=reject_duplicate_json_keys,
                parse_constant=reject_json_constant,
            )

        transactions = broadcast.get("transactions")
        receipts = broadcast.get("receipts")
        if not isinstance(transactions, list) or not isinstance(receipts, list):
            raise SystemExit("Forge broadcast output must contain transactions and receipts arrays")

        roots = [
            tx for tx in transactions
            if isinstance(tx, dict) and tx.get("transactionType") == "CREATE" and tx.get("contractName") == "CamRoot"
        ]
        if len(roots) != 1:
            raise SystemExit("Forge broadcast output must contain exactly one CamRoot transaction")
        root = roots[0]
        host = root.get("contractAddress")
        tx_hash = root.get("hash")
        if not isinstance(host, str) or EVM_ADDRESS_RE.fullmatch(host) is None:
            raise SystemExit("CamRoot contractAddress not found in Forge broadcast output")

        senders = {
            receipt.get("from")
            for receipt in receipts
            if isinstance(receipt, dict) and receipt.get("transactionHash") == tx_hash
        }
        if len(senders) != 1:
            raise SystemExit("Forge broadcast must identify one CamRoot deployment sender")
        account = next(iter(senders))
        if not isinstance(account, str) or EVM_ADDRESS_RE.fullmatch(account) is None:
            raise SystemExit("CamRoot deployment sender is not an EVM address")

        query = urlencode({
            "chainId": os.environ["CHAIN_ID"],
            "host": host,
            "account": account,
            "rpcUrl": os.environ["RPC_URL"],
        })
        print(f"{os.environ['GUI_URL']}?{query}")

networks:
  pay-to-play_local:
    internal: true
  pay-to-play_browser:
